- id: l21-t7
  type: code
  title: №7. Сеть
  level: 3
  required: true
  homework: false
  mcko:
  - 7
  statement: |
    Даны IP-адрес и маска сети (в сети не больше 1024 адресов). Сколько адресов этой сети (включая адрес сети и широковещательный) содержат в двоичной записи чётное число единиц? Число единиц считается по всем 32 битам адреса.
  input_format: Две строки — IP-адрес и маска.
  output_format: Одно число.
  starter: |
    ip = input().split(".")
    mask = input().split(".")
    # твой код
  examples:
  - &id013 {input: '192.168.5.130

      255.255.255.192', output: '32'}
  - &id014 {input: '10.0.0.5

      255.255.255.252', output: '2'}
  tests:
  - *id013
  - *id014
  - {input: '172.16.3.200

      255.255.255.0', output: '128', hidden: true}
  - {input: '1.2.3.4

      255.255.255.254', output: '1', hidden: true}
  - {input: '192.168.100.1

      255.255.252.0', output: '512', hidden: true}
  - {input: '200.100.50.25

      255.255.255.224', output: '16', hidden: true}
  - {input: '8.8.8.8

      255.255.255.255', output: '1', hidden: true}
  checker: exact
  hints:
  - Собери 32-битные числа ip_number и mask_number (n = n * 256 + октет).
  - 'Адрес сети: ip_number & mask_number. Узловых бит — столько, сколько нулей в маске; адресов 2 ** этих бит: 2 ** 32 - mask_number.'
  - 'Перебери смещения от 0 до размера − 1: адрес = сеть + смещение; bin(адрес).count("1") % 2 == 0.'
  solution: |
    ip = input().split(".")
    mask = input().split(".")
    ip_number = 0
    mask_number = 0
    for i in range(4):
        ip_number = ip_number * 256 + int(ip[i])
        mask_number = mask_number * 256 + int(mask[i])
    network = ip_number & mask_number
    size = 2 ** 32 - mask_number
    count = 0
    for offset in range(size):
        if bin(network + offset).count("1") % 2 == 0:
            count += 1
    print(count)
  explanation: |
    Соединяет урок 18 (сеть) и перебор. Размер сети: 2**32 − маска.
- id: l21-t8
  type: code
  title: №8. RSA
  level: 3
  required: true
  homework: false
  mcko:
  - 8
  statement: |
    Даны простые числа p и q, число e и диапазон [lo, hi]. Найдите наибольшее d из диапазона, для которого (d·e) mod f = 1, где f = (p − 1)·(q − 1). Такое d существует.
  input_format: Пять строк — p, q, e, lo, hi.
  output_format: Число d.
  starter: |
    p = int(input())
    q = int(input())
    e = int(input())
    lo = int(input())
    hi = int(input())
    # твой код
  examples:
  - &id015 {input: '11

      13

      7

      1

      200', output: '103'}
  - &id016 {input: '17

      19

      5

      1

      300', output: '173'}
  tests:
  - *id015
  - *id016
  - {input: '7

      11

      7

      1

      70', output: '43', hidden: true}
  - {input: '13

      17

      5

      1

      200', output: '77', hidden: true}
  - {input: '23

      29

      5

      1

      600', output: '493', hidden: true}
  - {input: '11

      13

      7

      100

      130', output: '103', hidden: true}
  - {input: '53

      59

      3

      1

      3000', output: '2011', hidden: true}
  checker: exact
  hints:
  - f = (p - 1) * (q - 1).
  - Перебери d от lo до hi.
  - Запоминай d, если d * e % f == 1; после цикла останется последнее, то есть наибольшее.
  solution: |
    p = int(input())
    q = int(input())
    e = int(input())
    lo = int(input())
    hi = int(input())
    f = (p - 1) * (q - 1)
    answer = 0
    for d in range(lo, hi + 1):
        if d * e % f == 1:
            answer = d
    print(answer)
  explanation: |
    В уроке 17 искали наименьшее; здесь наибольшее.
