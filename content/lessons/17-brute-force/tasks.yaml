- id: l17-t11
  type: code
  title: 'МЦКО-2: бит чётности'
  level: 4
  required: false
  homework: true
  mcko:
  - 2
  statement: |
    Автомат: записываем N в двоичной системе. Шаг A: если в записи нечётное число единиц, справа дописываем 1, иначе 0. Шаг A выполняется два раза подряд. Результат R — число в десятичной системе. Найдите наименьшее N, при котором R больше X.
  input_format: Одна строка — число X.
  output_format: Число N.
  starter: |
    x = int(input())
    n = 0
    r = 0
    # пока R не больше X, увеличивай N
  examples:
  - &id021 {input: '100', output: '25'}
  - &id022 {input: '1', output: '1'}
  tests:
  - *id021
  - *id022
  - {input: '10', output: '3', hidden: true}
  - {input: '255', output: '64', hidden: true}
  - {input: '1000', output: '251', hidden: true}
  - {input: '31', output: '8', hidden: true}
  - {input: '500', output: '126', hidden: true}
  checker: exact
  hints:
  - 'Шаг A: s.count("1") % 2 == 1 → s += "1", иначе s += "0".'
  - Повтори шаг A дважды с обновлённой записью (число единиц изменилось!).
  - Остальное как в задаче 7.
  solution: |
    x = int(input())
    n = 0
    r = 0
    while r <= x:
        n += 1
        s = bin(n)[2:]
        for step in range(2):
            if s.count("1") % 2 == 1:
                s += "1"
            else:
                s += "0"
        r = int(s, 2)
    print(n)
  explanation: |
    Звёздочка: шаг применяется дважды, поэтому count считаем заново. Похоже на реальный тип МЦКО-2.
