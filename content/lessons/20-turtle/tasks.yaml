                i = j + 1
            else:
                expanded.append(tokens[i])
                i += 1
        x = 0
        y = 0
        angle = 0
        pen = True
        dx = [0, 1, 0, -1]
        dy = [1, 0, -1, 0]
        xs = []
        ys = []
        i = 0
        while i < len(expanded):
            command = expanded[i]
            value = expanded[i + 1]
            if command == "Поднять":
                pen = False
            elif command == "Опустить":
                pen = True
            elif command == "Направо":
                angle = (angle + int(value)) % 360
            elif command == "Налево":
                angle = (angle - int(value)) % 360
            else:
                step = int(value)
                if command == "Назад":
                    step = -step
                if pen:
                    xs.append(x)
                    ys.append(y)
                x += dx[angle // 90] * step
                y += dy[angle // 90] * step
                if pen:
                    xs.append(x)
                    ys.append(y)
            i += 2
