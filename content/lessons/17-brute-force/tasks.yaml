- id: l17-t3
  type: code
  title: 'МЦКО-6: номер слова'
  level: 1
  required: true
  homework: false
  mcko:
  - 6
  statement: |
    Все слова длины k из букв алфавита выписаны в алфавитном порядке и пронумерованы с единицы. Какой номер у данного слова? Длина слова равна k.
  input_format: Две строки — алфавит и слово.
  output_format: Одно число.
  starter: |
    import itertools
    alphabet = input()
    word = input()
    # перебирай слова и сравнивай с word
  examples:
  - &id005 {input: 'АБВ

      БВ', output: '6'}
  - &id006 {input: 'АБ

      ББ', output: '4'}
  tests:
  - *id005
  - *id006
  - {input: 'АБВГ

      ГГГ', output: '64', hidden: true}
  - {input: 'АБВ

      ААА', output: '1', hidden: true}
  - {input: 'КОТ

      ТОК', output: '22', hidden: true}
  - {input: 'ЛЕС

      СЕЛ', output: '22', hidden: true}
  checker: exact
  hints:
  - Длина слова — len(word).
  - Перебирай enumerate(itertools.product(alphabet, repeat=len(word)), 1).
  - Когда "".join(letters) совпало с word, выведи номер.
  solution: |
    import itertools
    alphabet = input()
    word = input()
    for number, letters in enumerate(itertools.product(alphabet, repeat=len(word)), 1):
        if "".join(letters) == word:
            print(number)
  explanation: |
    Проверьте вручную: в алфавите из 3 букв слово БВ — шестое.
- id: l17-t4
  type: code
  title: 'МЦКО-2: один шаг автомата'
  level: 2
  required: true
  homework: false
  mcko:
  - 2
  statement: |
    Автомат: записываем N в двоичной системе; если N чётное, справа дописываем 0, иначе справа дописываем 11. Результат R — число, которое получилось, в десятичной системе. Найдите R.
  input_format: Одна строка — натуральное число N.
  output_format: Число R.
  starter: |
    n = int(input())
    # двоичная запись, дописать биты, обратно в десятичную
  examples:
  - &id007 {input: '5', output: '23'}
  - &id008 {input: '4', output: '8'}
  tests:
  - *id007
  - *id008
  - {input: '1', output: '7', hidden: true}
  - {input: '2', output: '4', hidden: true}
  - {input: '7', output: '31', hidden: true}
  - {input: '100', output: '200', hidden: true}
  - {input: '255', output: '1023', hidden: true}
  checker: exact
  hints:
  - 'Запись: s = bin(n)[2:].'
  - Если n % 2 == 0, s += "0", иначе s += "11".
  - R = int(s, 2).
  solution: |
    n = int(input())
    s = bin(n)[2:]
    if n % 2 == 0:
        s += "0"
    else:
        s += "11"
    print(int(s, 2))
  explanation: |
    Пример из теории. Вручную: 5 = 101 → 10111 = 23.
- id: l17-t5
  type: code
  title: 'МЦКО-6: слова без буквы'
  level: 2
  required: true
  homework: false
  mcko:
  - 6
  statement: |
    Выписаны все слова длины k из букв алфавита в алфавитном порядке, но только те, в которых нет буквы x. Нумерация с единицы. Найдите номер данного слова (в нём буквы x нет).
  input_format: Три строки — алфавит, буква x, слово.
  output_format: Одно число.
  starter: |
    import itertools
    alphabet = input()
    x = input()
    word = input()
    number = 0
    # считай только слова без x
  examples:
  - &id009 {input: 'АБВ

      Б

      ВА', output: '3'}
  - &id010 {input: 'АБВ

      А

      ББ', output: '1'}
  tests:
  - *id009
  - *id010
  - {input: 'АБВГ

      В

      ГГ', output: '9', hidden: true}
  - {input: 'АБ

      А

      ББББ', output: '1', hidden: true}
  - {input: 'АБВ

      В

      БАБ', output: '6', hidden: true}
  - {input: 'КОТ

      О

      ТТ', output: '4', hidden: true}
  checker: exact
  hints:
  - Перебирай все слова product(alphabet, repeat=len(word)).
  - Слово подходит, если x not in w. Увеличивай number только для подходящих.
  - Когда w == word, выведи number.
  solution: |
    import itertools
    alphabet = input()
    x = input()
    word = input()
    number = 0
    for letters in itertools.product(alphabet, repeat=len(word)):
        w = "".join(letters)
        if x not in w:
            number += 1
            if w == word:
                print(number)
  explanation: |
    Нумеруем только подходящие слова, поэтому `enumerate` здесь не нужен: нужен счётчик.
- id: l17-t6
  type: code
  title: 'МЦКО-8: проверка ключа'
  level: 2
  required: true
  homework: false
  mcko:
  - 8
  statement: |
    В RSA даны простые числа p и q, число f = (p − 1)·(q − 1) и числа e и d. Выведите «Да», если (d·e) mod f = 1, иначе «Нет».
  input_format: Четыре строки — p, q, e, d.
  output_format: «Да» или «Нет».
  starter: |
    p = int(input())
    q = int(input())
    e = int(input())
    d = int(input())
    # f, потом остаток
  examples:
  - &id011 {input: '11

      13

      7

      103', output: Да}
  - &id012 {input: '3

      11

      3

      7', output: Да}
  tests:
  - *id011
  - *id012
  - {input: '5

      7

      5

      5', output: Да, hidden: true}
  - {input: '7

      11

      7

      43', output: Да, hidden: true}
  - {input: '5

      13

      7

      7', output: Да, hidden: true}
  - {input: '13

      17

      5

      77', output: Да, hidden: true}
  - {input: '101

      103

      3

      6667', output: Нет, hidden: true}
  checker: exact
  hints:
  - f = (p - 1) * (q - 1).
  - 'Условие: d * e % f == 1.'
  solution: |
    p = int(input())
    q = int(input())
    e = int(input())
    d = int(input())
    f = (p - 1) * (q - 1)
    if d * e % f == 1:
        print("Да")
    else:
        print("Нет")
  explanation: |
    Прямая подстановка в формулу МЦКО-8. Остаток из урока 2.
- id: l17-t7
  type: code
  title: 'МЦКО-2: наименьшее N'
  level: 3
  required: true
  homework: false
  mcko:
  - 2
  statement: |
    Автомат из задачи «один шаг»: если N чётное, дописывается 0, иначе 11. Найдите наименьшее натуральное N, при котором R больше X.
  input_format: Одна строка — число X.
  output_format: Число N.
  starter: |
    x = int(input())
    n = 1
    # пока R не больше X, пробуй следующее N
  examples:
  - &id013 {input: '50', output: '13'}
  - &id014 {input: '1', output: '1'}
  tests:
  - *id013
  - *id014
  - {input: '100', output: '25', hidden: true}
  - {input: '20', output: '5', hidden: true}
  - {input: '1000', output: '251', hidden: true}
  - {input: '8', output: '3', hidden: true}
  - {input: '300', output: '75', hidden: true}
  checker: exact
  hints:
  - 'Цикл while r <= x: пока ответ не подходит.'
  - 'Внутри: n += 1, затем считай r так же, как в прошлой задаче.'
  - Когда r станет больше x, цикл закончится — выведи n.
  solution: |
    x = int(input())
    n = 0
    r = 0
    while r <= x:
        n += 1
        s = bin(n)[2:]
        if n % 2 == 0:
            s += "0"
        else:
            s += "11"
        r = int(s, 2)
    print(n)
  explanation: |
    Классический «поиск первого подходящего»: цикл while идёт, пока ответ не подходит. Сначала вручную для X = 20: N = 5 даёт 23.
