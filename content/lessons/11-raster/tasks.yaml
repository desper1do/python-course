- id: l11-t1
  type: code
  title: Число пикселей
  level: 1
  required: true
  homework: false
  mcko: []
  statement: |
    Изображение имеет ширину w и высоту h пикселей. Сколько в нём пикселей?
  input_format: Две строки — w и h.
  output_format: Одно число.
  starter: |
    w = int(input())
    h = int(input())
    # число пикселей
  examples:
  - &id001 {input: '640

      480', output: '307200'}
  - &id002 {input: '1

      1', output: '1'}
  tests:
  - *id001
  - *id002
  - {input: '1920

      1080', output: '2073600', hidden: true}
  - {input: '10

      1', output: '10', hidden: true}
  - {input: '100

      100', output: '10000', hidden: true}
  - {input: '3

      7', output: '21', hidden: true}
  checker: exact
  hints:
  - Пикселей — это ширина умножить на высоту.
  - print(w * h)
  solution: |
    w = int(input())
    h = int(input())
    print(w * h)
  explanation: |
    Самая простая формула урока.
