- id: l18-t10
  type: code
  title: 'МЦКО-7: номер узла'
  level: 3
  required: true
  homework: false
  mcko:
  - 7
  statement: |
    Номер узла в сети — число, образованное теми битами адреса, где в маске стоят нули (как обычное число). Найдите номер узла по IP-адресу и маске. Для этого переведите оба адреса в одно 32-битное число: a·256³ + b·256² + c·256 + d.
  input_format: Две строки — IP-адрес и маска.
  output_format: Одно число.
  starter: |
    ip = input().split(".")
    mask = input().split(".")
    ip_number = 0
    mask_number = 0
    # собери 32-битные числа
  examples:
  - &id019 {input: '192.168.5.130

      255.255.255.192', output: '2'}
  - &id020 {input: '10.20.30.40

      255.255.0.0', output: '7720'}
  tests:
  - *id019
  - *id020
  - {input: '192.168.1.200

      255.255.255.224', output: '8', hidden: true}
  - {input: '172.16.5.9

      255.255.248.0', output: '1289', hidden: true}
  - {input: '1.2.3.4

      255.255.255.255', output: '0', hidden: true}
  - {input: '200.100.50.25

      255.255.255.0', output: '25', hidden: true}
  - {input: '130.5.9.77

      255.255.128.0', output: '2381', hidden: true}
  checker: exact
  hints:
  - '32-битное число собирают так: n = n * 256 + очередной октет (для каждого октета по порядку).'
  - 'Узловая часть: ip_number & (2 ** 32 - 1 - mask_number) — единицы там, где в маске нули.'
  - Результат и есть номер узла.
  solution: |
    ip = input().split(".")
    mask = input().split(".")
    ip_number = 0
    mask_number = 0
    for i in range(4):
        ip_number = ip_number * 256 + int(ip[i])
        mask_number = mask_number * 256 + int(mask[i])
    print(ip_number & (2 ** 32 - 1 - mask_number))
  explanation: |
    Аналог схемы Горнера из урока 14. Инверсия маски: `2**32 - 1 - mask`.
- id: l18-t11
  type: code
  title: 'МЦКО-7: сколько масок'
  level: 4
  required: false
  homework: true
  mcko:
  - 7
  statement: |
    Даны IP-адрес и адрес сети. Сколько существует масок (с n единицами подряд слева, n от 0 до 32), для которых IP-адрес и маска (поразрядное И) дают именно этот адрес сети?
  input_format: Две строки — IP-адрес и адрес сети.
  output_format: Одно число.
  starter: |
    ip = input().split(".")
    net = input().split(".")
    ip_number = 0
    net_number = 0
    # собери 32-битные числа и перебери n
  examples:
  - &id021 {input: '192.168.5.130

      192.168.5.128', output: '6'}
  - &id022 {input: '10.20.30.40

      10.0.0.0', output: '5'}
  tests:
  - *id021
  - *id022
  - {input: '192.168.1.200

      192.168.1.192', output: '3', hidden: true}
  - {input: '172.16.5.9

      172.16.0.0', output: '10', hidden: true}
  - {input: '1.2.3.4

      1.2.3.4', output: '3', hidden: true}
  - {input: '200.100.50.25

      200.100.50.0', output: '5', hidden: true}
  - {input: '130.5.9.77

      130.5.0.0', output: '5', hidden: true}
  checker: exact
  hints:
  - Собери два 32-битных числа, как в задаче про номер узла.
  - 'Маска с n единицами: 2 ** 32 - 2 ** (32 - n).'
  - Проверяй ip_number & mask == net_number для n от 0 до 32 и считай подходящие.
  solution: |
    ip = input().split(".")
    net = input().split(".")
    ip_number = 0
    net_number = 0
    for i in range(4):
        ip_number = ip_number * 256 + int(ip[i])
        net_number = net_number * 256 + int(net[i])
    count = 0
    for n in range(33):
        mask = 2 ** 32 - 2 ** (32 - n)
        if ip_number & mask == net_number:
            count += 1
    print(count)
  explanation: |
    Звёздочка: обратная задача МЦКО-7 перебором длины префикса.
