- id: l12-t1
  type: code
  title: Сумма, минимум, максимум
  level: 1
  required: true
  homework: false
  mcko: []
  statement: |
    Вводится n, затем n целых чисел по одному на строке. Выведите сумму, наименьшее и наибольшее число, каждое на своей строке.
  input_format: Первая строка — n, затем n чисел.
  output_format: Три строки.
  starter: |
    n = int(input())
    numbers = []
    # прочитай n чисел в список
  examples:
  - &id001 {input: '3

      3

      1

      2', output: '6

      1

      3'}
  - &id002 {input: '1

      5', output: '5

      5

      5'}
  tests:
  - *id001
  - *id002
  - {input: '3

      -3

      -8

      0', output: '-11

      -8

      0', hidden: true}
  - {input: '4

      4

      4

      4

      4', output: '16

      4

      4', hidden: true}
  - {input: '5

      10

      20

      30

      40

      50', output: '150

      10

      50', hidden: true}
  - {input: '2

      -1

      1', output: '0

      -1

      1', hidden: true}
  checker: exact
  hints:
  - 'Читай числа: numbers.append(int(input())).'
  - 'После цикла: sum(numbers), min(numbers), max(numbers).'
  solution: |
    n = int(input())
    numbers = []
    for i in range(n):
        numbers.append(int(input()))
    print(sum(numbers))
    print(min(numbers))
    print(max(numbers))
  explanation: |
    Заменяет три накопителя из урока 10 тремя встроенными функциями.
