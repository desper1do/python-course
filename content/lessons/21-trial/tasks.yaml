- id: l21-t10
  type: code
  title: №10. Черепаха
  level: 3
  required: true
  homework: false
  mcko:
  - 10
  statement: |
    Две программы Черепахи (на двух строках) рисуют два прямоугольника (используйте готовую функцию `bounding_box`, она возвращает x_min, y_min, x_max, y_max). Сколько точек с целыми координатами лежит строго внутри ровно одной из двух фигур?
  input_format: Две строки — программы.
  output_format: Одно число.
  starter: |
    def bounding_box(line):
        tokens = line.split()
        expanded = []
        i = 0
        while i < len(tokens):
            if tokens[i] == "Повтори":
                k = int(tokens[i + 1])
                j = i + 3
                body = []
                while tokens[j] != "]":
                    body.append(tokens[j])
                    j += 1
                for r in range(k):
                    expanded += body
                i = j + 1
            else:
                expanded.append(tokens[i])
                i += 1
        x = 0
        y = 0
        angle = 0
        pen = True
        dx = [0, 1, 0, -1]
        dy = [1, 0, -1, 0]
        xs = []
        ys = []
