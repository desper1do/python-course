- id: l14-t1
  type: code
  title: Из двоичной в десятичную
  level: 1
  required: true
  homework: false
  mcko:
  - 3
  statement: |
    Дано число в двоичной системе. Переведите в десятичную.
  input_format: Одна строка — число из нулей и единиц.
  output_format: Одно число.
  starter: |
    s = input()
    # переведи через int(s, 2)
  examples:
  - &id001 {input: '1011', output: '11'}
  - &id002 {input: '0', output: '0'}
  tests:
  - *id001
  - *id002
  - {input: '1', output: '1', hidden: true}
  - {input: '11111111', output: '255', hidden: true}
  - {input: '100000', output: '32', hidden: true}
  - {input: '101010', output: '42', hidden: true}
  checker: exact
  hints:
  - Функция int принимает второй аргумент — основание системы.
  - print(int(s, 2))
  solution: |
    s = input()
    print(int(s, 2))
  explanation: |
    Проверьте несколько ответов вручную по весам разрядов, а потом программой.
- id: l14-t2
  type: code
  title: Из десятичной в двоичную
  level: 1
  required: true
  homework: false
  mcko:
  - 3
  statement: |
    Дано десятичное число. Выведите его двоичную запись без префикса.
  input_format: Одна строка — целое число n ≥ 0.
  output_format: Двоичная запись.
  starter: |
    n = int(input())
    # bin(n) даёт '0b...'
  examples:
  - &id003 {input: '11', output: '1011'}
  - &id004 {input: '0', output: '0'}
  tests:
  - *id003
  - *id004
  - {input: '1', output: '1', hidden: true}
  - {input: '255', output: '11111111', hidden: true}
  - {input: '32', output: '100000', hidden: true}
  - {input: '1000', output: '1111101000', hidden: true}
