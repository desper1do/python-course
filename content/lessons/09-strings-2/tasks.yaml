- id: l09-t9
  type: code
  title: Сжатие строки
  level: 4
  required: false
  homework: true
  mcko: []
  statement: |
    Сожмите строку: каждую группу одинаковых подряд идущих символов замените на символ и длину группы. Например, aaabcc превращается в a3b1c2.
  input_format: Одна строка (не пустая).
  output_format: Сжатая строка.
  starter: |
    s = input()
    result = ""
    # сравнивай каждый символ с предыдущим
  examples:
  - &id017 {input: aaabcc, output: a3b1c2}
  - &id018 {input: abc, output: a1b1c1}
  tests:
  - *id017
  - *id018
  - {input: aaaa, output: a4, hidden: true}
  - {input: a, output: a1, hidden: true}
  - {input: aabbaa, output: a2b2a2, hidden: true}
  - {input: zzzxyyy, output: z3x1y3, hidden: true}
  - {input: xxxxxxxxxxxy, output: x11y1, hidden: true}
  checker: exact
  hints:
  - Заведи счётчик группы count = 1 и иди по индексам от 1.
  - Если s[i] == s[i - 1], count += 1. Иначе допиши в result предыдущий символ и счётчик, а count снова 1.
  - После цикла допиши последнюю группу.
  solution: |
    s = input()
    result = ""
    count = 1
    for i in range(1, len(s)):
        if s[i] == s[i - 1]:
            count += 1
        else:
            result += s[i - 1] + str(count)
            count = 1
    result += s[-1] + str(count)
    print(result)
  explanation: |
    Звёздочка: последняя группа дописывается после цикла — типичная ошибка.
