- id: l16-t1
  type: code
  title: Условие Фано
  level: 1
  required: true
  homework: false
  mcko:
  - 1
  statement: |
    Дан набор кодов. Выведите «Да», если выполнено условие Фано (ни один код не является началом другого, одинаковых кодов нет), иначе «Нет».
  input_format: Первая строка — число кодов n, затем n строк с кодами из 0 и 1.
  output_format: «Да» или «Нет».
  starter: |
    n = int(input())
    codes = []
    for i in range(n):
        codes.append(input())
    # сравни каждую пару кодов
  examples:
  - &id001 {input: '3

      0

      10

      11', output: Да}
  - &id002 {input: '3

      0

      01

      11', output: Нет}
  tests:
  - *id001
  - *id002
  - {input: '2

      1

      1', output: Нет, hidden: true}
  - {input: '4

      00

      01

      10

      11', output: Да, hidden: true}
  - {input: '3

      1

      10

      110', output: Нет, hidden: true}
  - {input: '1

      0', output: Да, hidden: true}
  - {input: '4

      010

      011

      10

      11', output: Да, hidden: true}
  - {input: '3

      101

      10

      0', output: Нет, hidden: true}
  checker: exact
  hints:
  - 'Две вложенные проверки: для каждой пары разных номеров i и j.'
  - 'Нарушение: codes[j].startswith(codes[i]) (для i != j). Равные коды тоже попадают сюда.'
  - Заведи флаг ok = True и сбрасывай его при нарушении.
  solution: |
    n = int(input())
    codes = []
    for i in range(n):
        codes.append(input())
    ok = True
    for i in range(n):
        for j in range(n):
            if i != j and codes[j].startswith(codes[i]):
                ok = False
    if ok:
        print("Да")
    else:
        print("Нет")
  explanation: |
    Вложенный цикл по парам. `startswith` покрывает и равные коды.
- id: l16-t2
  type: code
  title: Длина сообщения
  level: 1
  required: true
  homework: false
  mcko:
  - 1
  statement: |
    Даны буквы и их коды, затем сообщение. Выведите длину закодированного сообщения в битах.
  input_format: Первая строка — число букв n. Затем n строк «буква код». Затем строка с сообщением.
  output_format: Одно число.
  starter: |
    n = int(input())
    letters = []
    codes = []
    for i in range(n):
        parts = input().split()
        letters.append(parts[0])
        codes.append(parts[1])
    message = input()
    # сложи длины кодов всех букв сообщения
  examples:
  - &id003 {input: '3

      A 0

      B 10

      C 11

      ABACA', output: '7'}
  - &id004 {input: '2

      X 1

      Y 0

      XXXX', output: '4'}
  tests:
  - *id003
  - *id004
  - {input: '3

      A 0

      B 10

      C 11

      C', output: '2', hidden: true}
  - {input: '4

      A 00

      B 01

      C 10

      D 11

      ABCD', output: '8', hidden: true}
  - {input: '3

      A 0

      B 10

      C 11

      BBBBBB', output: '12', hidden: true}
  - {input: '3

      A 0

      B 10

      C 11

      ABBA', output: '6', hidden: true}
  checker: exact
  hints:
  - 'Для каждой буквы сообщения найди её номер: идём по letters и сравниваем.'
  - Если letters[i] == ch, прибавь len(codes[i]) к total.
  solution: |
    n = int(input())
    letters = []
    codes = []
    for i in range(n):
        parts = input().split()
        letters.append(parts[0])
        codes.append(parts[1])
    message = input()
    total = 0
    for ch in message:
        for i in range(n):
            if letters[i] == ch:
                total += len(codes[i])
    print(total)
  explanation: |
    Вводим таблицу в два параллельных списка (словарей мы не проходили).
- id: l16-t3
  type: code
  title: Сколько кодов не длиннее k
  level: 1
  required: true
  homework: false
  mcko:
  - 1
  statement: |
    Сколько различных двоичных строк длиной от 1 до k бит включительно?
  input_format: Одна строка — целое число k (1 ≤ k ≤ 20).
  output_format: Одно число.
  starter: |
    k = int(input())
    total = 0
    # сколько строк каждой длины?
  examples:
  - &id005 {input: '1', output: '2'}
  - &id006 {input: '2', output: '6'}
  tests:
  - *id005
  - *id006
  - {input: '3', output: '14', hidden: true}
  - {input: '10', output: '2046', hidden: true}
  - {input: '20', output: '2097150', hidden: true}
  - {input: '5', output: '62', hidden: true}
