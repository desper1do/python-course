- id: l20-t1
  type: code
  title: Куда смотрит Черепаха
  level: 1
  required: true
  homework: false
  mcko:
  - 10
  statement: |
    Дана последовательность поворотов. Черепаха смотрит вверх (угол 0). «Направо a» прибавляет a к углу, «Налево a» вычитает. Выведите итоговый угол от 0 до 359.
  input_format: Первая строка — n, затем n строк «Направо a» или «Налево a».
  output_format: Одно число.
  starter: |
    n = int(input())
    angle = 0
    # обрабатывай команды по одной
  examples:
  - &id001 {input: '1

      Направо 270', output: '270'}
  - &id002 {input: '2

      Направо 90

      Направо 180', output: '270'}
  tests:
  - *id001
  - *id002
  - {input: '3

      Направо 270

      Направо 180

      Налево 270', output: '180', hidden: true}
  - {input: '4

      Направо 180

      Направо 270

      Налево 180

      Направо 90', output: '0', hidden: true}
  - {input: '5

      Налево 270

      Налево 270

      Направо 180

      Направо 270

      Направо 90', output: '0', hidden: true}
  - {input: '6

      Направо 180

      Налево 90

      Направо 90

      Налево 270

      Налево 180

      Направо 180', output: '270', hidden: true}
  - {input: '3

      Налево 90

      Налево 270

      Направо 90', output: '90', hidden: true}
  checker: exact
  hints:
  - 'Прочитай команду: parts = input().split(); parts[0] — слово, parts[1] — число.'
  - 'Направо: angle += число, Налево: angle -= число.'
  - 'В конце приведи к диапазону: angle % 360.'
  solution: |
    n = int(input())
    angle = 0
    for i in range(n):
        parts = input().split()
        value = int(parts[1])
        if parts[0] == "Направо":
            angle += value
        else:
            angle -= value
    print(angle % 360)
  explanation: |
    Остаток от деления на 360 работает и для отрицательных углов.
- id: l20-t2
  type: code
  title: Где окажется Черепаха
  level: 1
  required: true
  homework: false
  mcko:
  - 10
  statement: |
    Черепаха стартует в (0, 0), смотрит вверх. Выполните команды «Вперёд n», «Назад n», «Направо a», «Налево a» (a кратно 90). Выведите итоговые x и y через пробел.
  input_format: Первая строка — n, затем n команд.
  output_format: Два числа через пробел.
  starter: |
    n = int(input())
    x = 0
    y = 0
    angle = 0
    dx = [0, 1, 0, -1]
    dy = [1, 0, -1, 0]
    # выполняй команды
  examples:
  - &id003 {input: '2

      Налево 270

      Налево 180', output: 0 0}
  - &id004 {input: '4

      Налево 180

      Налево 270

      Налево 180

      Назад 7', output: -7 0}
  tests:
  - *id003
  - *id004
  - {input: '5

      Направо 180

      Налево 270

      Назад 4

      Налево 90

      Назад 3', output: 4 3, hidden: true}
  - {input: '6

      Вперёд 9

      Назад 5

      Налево 180

      Направо 270

      Вперёд 8

      Направо 180', output: 8 4, hidden: true}
  - {input: '8

      Назад 1

      Направо 270

      Вперёд 3

      Назад 1

      Вперёд 3

      Налево 180

      Назад 2

      Направо 180', output: -7 -1, hidden: true}
  - {input: '10

      Направо 180

      Налево 180

      Налево 90

      Налево 90

      Налево 270

      Налево 180

      Назад 4

      Вперёд 5

      Направо 180

      Налево 90', output: 1 0, hidden: true}
  - {input: '12

      Направо 180

      Направо 180

      Направо 90

      Налево 270

      Направо 270

      Направо 90

      Вперёд 4

      Налево 270

      Налево 180

      Направо 180

      Налево 270

      Налево 180', output: 0 -4, hidden: true}
  checker: tokens
  hints:
  - 'Для «Вперёд v»: x += dx[angle // 90] * v, y += dy[angle // 90] * v. Для «Назад» умножай на -v.'
  - 'Для поворота: angle = (angle + v) % 360 или (angle - v) % 360.'
  - Выведи print(x, y).
  solution: |
    n = int(input())
    x = 0
    y = 0
    angle = 0
    dx = [0, 1, 0, -1]
    dy = [1, 0, -1, 0]
    for i in range(n):
        parts = input().split()
        value = int(parts[1])
        if parts[0] == "Вперёд":
            x += dx[angle // 90] * value
            y += dy[angle // 90] * value
        elif parts[0] == "Назад":
            x -= dx[angle // 90] * value
            y -= dy[angle // 90] * value
        elif parts[0] == "Направо":
            angle = (angle + value) % 360
        else:
            angle = (angle - value) % 360
    print(x, y)
  explanation: |
    Главная задача урока: трассировка. Сначала на бумаге для первого примера.
- id: l20-t3
  type: code
  title: Сколько клеток на пути
  level: 2
  required: true
  homework: false
  mcko:
  - 10
  statement: |
    Программа записана одной строкой: пары «команда число» через пробел, без повторов (только Вперёд, Назад, Направо, Налево). Сколько различных точек с целыми координатами лежит на пути Черепахи, включая стартовую точку?
  input_format: Одна строка с программой.
  output_format: Одно число.
  starter: |
    tokens = input().split()
    x = 0
    y = 0
    angle = 0
    dx = [0, 1, 0, -1]
    dy = [1, 0, -1, 0]
    visited = {(0, 0)}
    # двигайся по одной клетке
  examples:
  - &id005 {input: Вперёд 3 Направо 90 Вперёд 2, output: '6'}
  - &id006 {input: Вперёд 2 Назад 2, output: '3'}
  tests:
  - *id005
  - *id006
  - {input: Вперёд 2 Направо 90 Вперёд 2 Направо 90 Вперёд 2 Направо 90 Вперёд 2, output: '8', hidden: true}
  - {input: Вперёд 1, output: '2', hidden: true}
  - {input: Направо 90 Вперёд 3 Налево 90 Вперёд 1, output: '5', hidden: true}
  - {input: Вперёд 3 Назад 1 Налево 90 Вперёд 2 Налево 90 Вперёд 2, output: '8', hidden: true}
  - {input: Назад 3 Налево 90 Направо 90 Вперёд 2 Вперёд 3 Направо 90 Направо 270, output: '6', hidden: true}
  checker: exact
  hints:
  - 'Для Вперёд v делай v шагов по одной клетке: for step in range(v).'
  - 'После каждого шага добавляй точку: visited.add((x, y)).'
  - Ответ — len(visited). Назад — шаг в противоположную сторону.
  solution: |
    tokens = input().split()
    x = 0
    y = 0
    angle = 0
    dx = [0, 1, 0, -1]
    dy = [1, 0, -1, 0]
    visited = {(0, 0)}
    i = 0
    while i < len(tokens):
        command = tokens[i]
        value = int(tokens[i + 1])
        if command == "Направо":
            angle = (angle + value) % 360
        elif command == "Налево":
            angle = (angle - value) % 360
        else:
            sign = 1
            if command == "Назад":
                sign = -1
            for step in range(value):
                x += dx[angle // 90] * sign
                y += dy[angle // 90] * sign
                visited.add((x, y))
        i += 2
    print(len(visited))
  explanation: |
    Множество пар-кортежей. Оно само убирает повторные точки.
- id: l20-t4
  type: code
  title: Границы нарисованного
  level: 2
  required: true
  homework: false
  mcko:
  - 10
  statement: |
    Программа Черепахи записана в одной строке (может содержать Повтори, Поднять хвост, Опустить хвост). Хвост в начале опущен. Найдите наименьшие и наибольшие координаты, до которых Черепаха дошла с опущенным хвостом: x_min, y_min, x_max, y_max. Функция `expand` (разворачивает «Повтори») уже написана. Рисунок существует.
  input_format: Одна строка с программой. Токены разделены пробелами; скобки тоже.
  output_format: Четыре числа через пробел.
  starter: |
    def expand(line):
        tokens = line.split()
        expanded = []
        i = 0
        while i < len(tokens):
            if tokens[i] == "Повтори":
                k = int(tokens[i + 1])
                j = i + 3
                body = []
                while tokens[j] != "]":
                    body.append(tokens[j])
                    j += 1
                for r in range(k):
                    expanded += body
                i = j + 1
            else:
                expanded.append(tokens[i])
                i += 1
        return expanded

    line = input()
    tokens = expand(line)
    # выполни команды, запоминая точки при опущенном хвосте
  examples:
  - &id007 {input: 'Поднять хвост Назад 2 Направо 90 Вперёд 4 Налево 90 Опустить хвост Повтори 2 [ Вперёд 4 Направо 90 Вперёд 10 Направо 90 ]', output: 4 -2 14 2}
  - &id008 {input: 'Поднять хвост Назад 2 Направо 90 Назад 1 Налево 90 Опустить хвост Повтори 2 [ Вперёд 8 Направо 90 Вперёд 3 Направо 90 ]', output: -1 -2 2 6}
  tests:
  - *id007
  - *id008
  - {input: Назад 3 Опустить хвост Поднять хвост Опустить хвост Поднять хвост Поднять хвост Налево 90 Вперёд 4, output: 0 -3 0 0, hidden: true}
  - {input: Опустить хвост Вперёд 4 Опустить хвост Назад 1 Вперёд 2 Поднять хвост Налево 90 Направо 90, output: 0 0 0 5, hidden: true}
  - {input: 'Повтори 4 [ Вперёд 2 Направо 90 ]', output: 0 0 2 2, hidden: true}
  - {input: Поднять хвост Вперёд 3 Опустить хвост Вперёд 2, output: 0 3 0 5, hidden: true}
  - {input: Налево 90 Назад 3 Вперёд 2 Опустить хвост Поднять хвост Вперёд 3 Налево 90, output: 0 0 3 0, hidden: true}
  checker: tokens
  hints:
  - Заведи списки xs и ys. Перед и после каждого Вперёд/Назад при pen == True добавляй текущие x и y.
  - Поднять — pen = False, Опустить — pen = True. Токены идут парами, поэтому шаг цикла i += 2.
  - 'Ответ: min(xs), min(ys), max(xs), max(ys).'
  solution: |
    def expand(line):
        tokens = line.split()
        expanded = []
        i = 0
        while i < len(tokens):
            if tokens[i] == "Повтори":
                k = int(tokens[i + 1])
                j = i + 3
                body = []
                while tokens[j] != "]":
                    body.append(tokens[j])
                    j += 1
                for r in range(k):
                    expanded += body
                i = j + 1
            else:
                expanded.append(tokens[i])
                i += 1
        return expanded

    line = input()
    tokens = expand(line)
    x = 0
    y = 0
    angle = 0
    pen = True
    dx = [0, 1, 0, -1]
    dy = [1, 0, -1, 0]
    xs = []
    ys = []
    i = 0
    while i < len(tokens):
        command = tokens[i]
        value = tokens[i + 1]
        if command == "Поднять":
            pen = False
        elif command == "Опустить":
            pen = True
        elif command == "Направо":
            angle = (angle + int(value)) % 360
        elif command == "Налево":
            angle = (angle - int(value)) % 360
        else:
            step = int(value)
            if command == "Назад":
                step = -step
            if pen:
                xs.append(x)
                ys.append(y)
            x += dx[angle // 90] * step
            y += dy[angle // 90] * step
            if pen:
                xs.append(x)
                ys.append(y)
        i += 2
    print(min(xs), min(ys), max(xs), max(ys))
  explanation: |
    Эта функция потом в `bounding_box` для следующих задач. Команды «Поднять хвост» — две лексемы: команда и слово «хвост».
