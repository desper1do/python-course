- id: l18-t1
  type: code
  title: Значение выражения
  level: 1
  required: true
  homework: false
  mcko: []
  statement: |
    Даны значения x, y, z (0 или 1). Выведите значение выражения «не x или (y и z)» как 0 или 1.
  input_format: Три строки — x, y, z.
  output_format: 0 или 1.
  starter: |
    x = int(input())
    y = int(input())
    z = int(input())
    # выведи int(...) от выражения
  examples:
  - &id001 {input: '0

      0

      0', output: '1'}
  - &id002 {input: '1

      1

      1', output: '1'}
  tests:
  - *id001
  - *id002
  - {input: '1

      0

      1', output: '0', hidden: true}
  - {input: '0

      1

      0', output: '1', hidden: true}
  - {input: '1

      1

      0', output: '0', hidden: true}
  - {input: '0

      1

      1', output: '1', hidden: true}
  - {input: '1

      0

      0', output: '0', hidden: true}
  checker: exact
  hints:
  - 'Выражение в Python: (not x) or (y and z).'
  - Чтобы получить 0 или 1, оберни в int(...).
  solution: |
    x = int(input())
    y = int(input())
    z = int(input())
    print(int((not x) or (y and z)))
  explanation: |
    Перевод выражения в Python.
