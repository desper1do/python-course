- id: l13-t4
  type: code
  title: Сумма цифр
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Напишите функцию `digit_sum(n)`, которая возвращает сумму цифр числа. Программа читает число и выводит результат функции.
  input_format: Одна строка — целое число n ≥ 0.
  output_format: Одно число.
  starter: |
    def digit_sum(n):
        total = 0
        # разбери число по цифрам
        return total

    n = int(input())
    print(digit_sum(n))
  examples:
  - &id007 {input: '482', output: '14'}
  - &id008 {input: '0', output: '0'}
  tests:
  - *id007
  - *id008
  - {input: '7', output: '7', hidden: true}
  - {input: '1000', output: '1', hidden: true}
  - {input: '99999', output: '45', hidden: true}
  - {input: '123456789', output: '45', hidden: true}
  checker: exact
  hints:
  - 'Цикл из урока 7: while n > 0.'
  - total += n % 10; n //= 10.
  solution: |
    def digit_sum(n):
        total = 0
        while n > 0:
            total += n % 10
            n //= 10
        return total

    n = int(input())
    print(digit_sum(n))
  explanation: |
    Задача 6 урока 7, но в виде функции.
- id: l13-t5
  type: code
  title: Простое ли (функция)
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Напишите функцию `is_prime(n)`, которая возвращает `True`, если число простое, иначе `False`. Программа выводит «Да» или «Нет».
  input_format: Одна строка — целое число n (1 ≤ n ≤ 100000).
  output_format: «Да» или «Нет».
  starter: |
    def is_prime(n):
        if n < 2:
            return False
        # проверь делители
        return True

    n = int(input())
    if is_prime(n):
        print("Да")
    else:
        print("Нет")
  examples:
  - &id009 {input: '2', output: Да}
  - &id010 {input: '97', output: Да}
  tests:
  - *id009
  - *id010
  - {input: '1', output: Нет, hidden: true}
  - {input: '4', output: Нет, hidden: true}
  - {input: '91', output: Нет, hidden: true}
  - {input: '99991', output: Да, hidden: true}
  - {input: '100000', output: Нет, hidden: true}
  checker: exact
  hints:
  - Перебирай d от 2 до n - 1.
  - 'Если n % d == 0, число составное: return False.'
  - Если цикл закончился без находки — return True (уже в заготовке).
  solution: |
    def is_prime(n):
        if n < 2:
            return False
        for d in range(2, n):
            if n % d == 0:
                return False
        return True

    n = int(input())
    if is_prime(n):
        print("Да")
    else:
        print("Нет")
  explanation: |
    Ранний `return` внутри цикла.
- id: l13-t6
  type: code
  title: Простые числа на отрезке
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Выведите все простые числа от a до b включительно, каждое на своей строке. Если простых нет, выведите «Нет». Функция `is_prime` уже написана.
  input_format: Две строки — целые числа a и b (1 ≤ a ≤ b ≤ 5000).
  output_format: Столбец чисел или «Нет».
  starter: |
    def is_prime(n):
        if n < 2:
            return False
        for d in range(2, n):
            if n % d == 0:
                return False
        return True

    a = int(input())
    b = int(input())
    # перебери числа от a до b
  examples:
  - &id011 {input: '1

      10', output: '2

      3

      5

      7'}
  - &id012 {input: '14

      16', output: Нет}
  tests:
  - *id011
  - *id012
  - {input: '2

      2', output: '2', hidden: true}
  - {input: '90

      100', output: '97', hidden: true}
  - {input: '1

      1', output: Нет, hidden: true}
  - {input: '4990

      5000', output: '4993

      4999', hidden: true}
  checker: exact
  hints:
  - Цикл for x in range(a, b + 1).
  - 'Если is_prime(x): выведи x и увеличь счётчик found.'
  - 'После цикла: если found == 0, выведи «Нет».'
  solution: |
    def is_prime(n):
        if n < 2:
            return False
        for d in range(2, n):
            if n % d == 0:
                return False
        return True

    a = int(input())
    b = int(input())
