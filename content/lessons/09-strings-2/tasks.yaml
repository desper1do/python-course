- id: l09-t5
  type: code
  title: Есть ли буква
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Даны слово и буква. Выведите «Да», если буква есть в слове, иначе «Нет».
  input_format: Две строки — слово и буква.
  output_format: «Да» или «Нет».
  starter: |
    word = input()
    letter = input()
    # используй in
  examples:
  - &id009 {input: 'python

      y', output: Да}
  - &id010 {input: 'кот

      а', output: Нет}
  tests:
  - *id009
  - *id010
  - {input: 'hello

      l', output: Да, hidden: true}
  - {input: 'a

      a', output: Да, hidden: true}
  - {input: 'Мир

      м', output: Нет, hidden: true}
  - {input: 'абвгд

      д', output: Да, hidden: true}
  checker: exact
  hints:
  - 'Проверка: letter in word.'
  - 'if letter in word: print("Да") и else.'
  solution: |
    word = input()
