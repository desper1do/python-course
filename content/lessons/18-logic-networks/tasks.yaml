- id: l18-t7
  type: code
  title: 'МЦКО-7: адрес сети'
  level: 2
  required: true
  homework: false
  mcko:
  - 7
  statement: |
    Даны IP-адрес и маска. Выведите адрес сети — результат поразрядного И адреса и маски, четыре числа через точку.
  input_format: Две строки — IP-адрес и маска (четыре числа через точку).
  output_format: Адрес сети через точки.
  starter: |
    ip = input().split(".")
    mask = input().split(".")
    parts = []
    # для каждого октета: ip & mask
  examples:
  - &id013 {input: '192.168.5.130

      255.255.255.192', output: 192.168.5.128}
  - &id014 {input: '10.20.30.40

      255.0.0.0', output: 10.0.0.0}
  tests:
  - *id013
  - *id014
  - {input: '172.16.255.255

      255.255.240.0', output: 172.16.240.0, hidden: true}
  - {input: '1.2.3.4

      255.255.255.255', output: 1.2.3.4, hidden: true}
  - {input: '200.100.50.25

      255.255.255.0', output: 200.100.50.0, hidden: true}
  - {input: '192.168.1.200

      255.255.255.224', output: 192.168.1.192, hidden: true}
  - {input: '130.5.9.77

      255.255.128.0', output: 130.5.0.0, hidden: true}
  checker: exact
  hints:
  - split(".") режет строку по точкам, получается список из четырёх строк.
  - 'Для каждого i: int(ip[i]) & int(mask[i]) — превратить в строку и добавить в parts.'
  - 'Склей через точку: ".".join(parts).'
  solution: |
    ip = input().split(".")
    mask = input().split(".")
    parts = []
    for i in range(4):
        parts.append(str(int(ip[i]) & int(mask[i])))
    print(".".join(parts))
  explanation: |
    Основа МЦКО-7. Октеты со значением 255 в маске переносят число без изменений, 0 — обнуляют.
- id: l18-t8
  type: code
  title: 'МЦКО-7: длина маски'
  level: 3
  required: true
  homework: false
  mcko:
  - 7
  statement: |
    Маска сети записана четырьмя числами. Найдите длину префикса — число единиц в двоичной записи маски.
  input_format: Одна строка — маска из четырёх чисел через точку.
  output_format: Число от 0 до 32.
  starter: |
    mask = input().split(".")
    count = 0
    # посчитай единицы в каждом октете
  examples:
  - &id015 {input: 255.255.255.0, output: '24'}
  - &id016 {input: 255.255.255.192, output: '26'}
  tests:
  - *id015
  - *id016
  - {input: 255.0.0.0, output: '8', hidden: true}
  - {input: 255.255.240.0, output: '20', hidden: true}
  - {input: 255.255.255.255, output: '32', hidden: true}
  - {input: 128.0.0.0, output: '1', hidden: true}
  - {input: 255.255.252.0, output: '22', hidden: true}
  checker: exact
  hints:
  - 'Единицы в числе: bin(число).count("1").'
  - Сложи по всем четырём октетам.
  solution: |
    mask = input().split(".")
    count = 0
    for part in mask:
        count += bin(int(part)).count("1")
    print(count)
  explanation: |
    Префикс — 24 для 255.255.255.0 и т. д.
