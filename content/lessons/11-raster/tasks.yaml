- id: l11-t7
  type: code
  title: 'МЦКО-4: цвета с прозрачностью'
  level: 3
  required: true
  homework: false
  mcko:
  - 4
  statement: |
    Изображение w × h пикселей занимает V Кбайт. Каждый пиксель хранит цвет и ещё a бит прозрачности; число бит на пиксель одинаково и максимально возможно. Найдите наибольшее число цветов.
  input_format: Четыре строки — w, h, V (в Кбайт), a.
  output_format: Одно число.
  starter: |
    w = int(input())
    h = int(input())
    V = int(input())
    a = int(input())
    # Кбайт в биты, бит на пиксель, вычти прозрачность
  examples:
  - &id013 {input: '640

      480

      300

      2', output: '64'}
  - &id014 {input: '800

      600

      468

      0', output: '128'}
  tests:
  - *id013
  - *id014
  - {input: '1000

      1000

      1000

      0', output: '256', hidden: true}
  - {input: '256

      256

      128

      8', output: '256', hidden: true}
  - {input: '100

      100

      30

      0', output: '16777216', hidden: true}
  - {input: '100

      100

      10

      4', output: '16', hidden: true}
  - {input: '200

      100

      80

      2', output: '1073741824', hidden: true}
  checker: exact
  hints:
  - 'Объём в битах: V * 1024 * 8.'
  - Бит на пиксель — это объём в битах // (w * h). Из них a — прозрачность.
  - Цвет получает (бит на пиксель − a) бит, цветов 2 в этой степени.
  solution: |
    w = int(input())
    h = int(input())
    V = int(input())
    a = int(input())
    bits = V * 1024 * 8
    per_pixel = bits // (w * h)
    i = per_pixel - a
    print(2 ** i)
  explanation: |
    Полноценный тип 4. Разберите разбор из теории и сверьте с первым примером (ответ 64).
- id: l11-t8
  type: code
  title: Изображение с палитрой
  level: 3
  required: true
  homework: false
  mcko:
  - 4
  statement: |
    Изображение w × h пикселей хранится с палитрой из N цветов. В каждом пикселе — номер цвета в палитре, одинаковое минимальное число бит. Сама палитра занимает 24 бита на цвет. Найдите весь объём в байтах (округлите вверх).
  input_format: Три строки — w, h, N.
  output_format: Одно число — байты.
  starter: |
    import math
    w = int(input())
    h = int(input())
    N = int(input())
    # номер цвета: сколько бит? плюс палитра
  examples:
  - &id015 {input: '100

      100

      16', output: '5048'}
  - &id016 {input: '10

      10

      2', output: '19'}
  tests:
  - *id015
  - *id016
  - {input: '64

      64

      256', output: '4864', hidden: true}
  - {input: '20

      5

      3', output: '34', hidden: true}
  - {input: '1

      1

      2', output: '7', hidden: true}
  - {input: '200

      100

      100', output: '17800', hidden: true}
  checker: exact
  hints:
  - 'Бит на номер: i = math.ceil(math.log2(N)).'
  - 'Пиксели: w * h * i бит. Палитра: N * 24 бит.'
  - 'Сложи, затем байты вверх: (bits + 7) // 8.'
  solution: |
    import math
    w = int(input())
    h = int(input())
    N = int(input())
    i = math.ceil(math.log2(N))
    bits = w * h * i + N * 24
    print((bits + 7) // 8)
  explanation: |
    Оригинальная задача на палитру. Складываем два объёма и только потом переводим в байты.
- id: l11-t9
  type: code
  title: Наибольший квадрат
  level: 4
  required: false
  homework: true
  mcko:
  - 4
  statement: |
    Квадратное изображение k × k пикселей, глубина цвета i бит, прозрачность a бит. Файл не может занимать больше V Кбайт. Найдите наибольшее возможное k.
  input_format: Три строки — V, i, a.
  output_format: Одно число.
  starter: |
    V = int(input())
    i = int(input())
    a = int(input())
    k = 1
    # увеличивай k, пока картинка (k + 1) × (k + 1) ещё помещается
  examples:
  - &id017 {input: '3

      24

      0', output: '32'}
  - &id018 {input: '1

      8

      0', output: '32'}
  tests:
  - *id017
  - *id018
  - {input: '100

      24

      8', output: '160', hidden: true}
  - {input: '4

      32

      0', output: '32', hidden: true}
  - {input: '10

      1

      0', output: '286', hidden: true}
  - {input: '1

      32

      0', output: '16', hidden: true}
  checker: exact
  hints:
  - 'Всего бит в файле: V * 1024 * 8; на пиксель i + a.'
  - Пока (k + 1) * (k + 1) * (i + a) <= bits, увеличивай k.
  - Цикл while.
  solution: |
    V = int(input())
    i = int(input())
    a = int(input())
    bits = V * 1024 * 8
    per_pixel = i + a
    k = 1
    while (k + 1) * (k + 1) * per_pixel <= bits:
        k += 1
    print(k)
  explanation: |
    Звёздочка: `while` с условием на объём. Допустимо считать, что хотя бы 1×1 помещается.
