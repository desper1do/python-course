  hints:
  - Получи границы обеих фигур.
  - 'Перебери все точки в общей рамке: x от min(ax1, bx1) до max(ax2, bx2), y аналогично.'
  - 'Для каждой точки: inside_a и inside_b. Считай, если inside_a != inside_b.'
  solution: |
    def bounding_box(line):
        tokens = line.split()
        expanded = []
        i = 0
        while i < len(tokens):
            if tokens[i] == "Повтори":
                k = int(tokens[i + 1])
                j = i + 3
                body = []
                while tokens[j] != "]":
                    body.append(tokens[j])
                    j += 1
                for r in range(k):
                    expanded += body
                i = j + 1
            else:
                expanded.append(tokens[i])
                i += 1
        x = 0
        y = 0
        angle = 0
        pen = True
        dx = [0, 1, 0, -1]
        dy = [1, 0, -1, 0]
        xs = []
        ys = []
        i = 0
        while i < len(expanded):
            command = expanded[i]
            value = expanded[i + 1]
            if command == "Поднять":
                pen = False
            elif command == "Опустить":
                pen = True
            elif command == "Направо":
                angle = (angle + int(value)) % 360
            elif command == "Налево":
                angle = (angle - int(value)) % 360
            else:
                step = int(value)
                if command == "Назад":
                    step = -step
                if pen:
                    xs.append(x)
                    ys.append(y)
                x += dx[angle // 90] * step
                y += dy[angle // 90] * step
                if pen:
                    xs.append(x)
                    ys.append(y)
            i += 2
        return min(xs), min(ys), max(xs), max(ys)

    first = input()
    second = input()
    ax1, ay1, ax2, ay2 = bounding_box(first)
    bx1, by1, bx2, by2 = bounding_box(second)
    count = 0
    for x in range(min(ax1, bx1), max(ax2, bx2) + 1):
        for y in range(min(ay1, by1), max(ay2, by2) + 1):
            inside_a = ax1 < x < ax2 and ay1 < y < ay2
            inside_b = bx1 < x < bx2 and by1 < y < by2
            if inside_a != inside_b:
                count += 1
    print(count)
  explanation: |
    Симметрическая разность двух фигур перебором по сетке.
