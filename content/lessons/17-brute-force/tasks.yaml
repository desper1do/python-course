  checker: exact
  hints:
  - 'f = (p - 1) * (q - 1). Диапазон d: range(1, f).'
  - Если d * e % f == 1, запомни d в answer.
  solution: |
    p = int(input())
    q = int(input())
    e = int(input())
    f = (p - 1) * (q - 1)
    answer = 0
    for d in range(1, f):
        if d * e % f == 1:
            answer = d
    print(answer)
  explanation: |
    Полный перебор при f до 22 000. Так работает RSA при маленьких ключах.
