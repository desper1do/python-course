- id: l11-t5
  type: code
  title: Максимум цветов по объёму
  level: 2
  required: true
  homework: false
  mcko:
  - 4
  statement: |
    Изображение w × h пикселей занимает V байт. Все пиксели кодируются одинаковым числом бит. Какое наибольшее число цветов оно может содержать?
  input_format: Три строки — w, h, V.
  output_format: Одно число — число цветов.
  starter: |
    w = int(input())
    h = int(input())
    V = int(input())
    # сколько бит на пиксель, потом 2 в этой степени
  examples:
  - &id009 {input: '640

      480

      307200', output: '256'}
  - &id010 {input: '100

      100

      10000', output: '256'}
  tests:
  - *id009
  - *id010
  - {input: '10

      10

      13', output: '2', hidden: true}
  - {input: '100

      200

      5000', output: '4', hidden: true}
  - {input: '50

      20

      375', output: '8', hidden: true}
  - {input: '1000

      1000

      3000000', output: '16777216', hidden: true}
  checker: exact
  hints:
  - 'Биты на пиксель: V * 8 // (w * h).'
  - Число цветов — 2 ** (биты на пиксель).
  solution: |
    w = int(input())
    h = int(input())
    V = int(input())
    i = V * 8 // (w * h)
    print(2 ** i)
  explanation: |
    МЦКО-4 без прозрачности.
- id: l11-t6
