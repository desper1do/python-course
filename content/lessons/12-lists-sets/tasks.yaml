- id: l12-t7
  type: code
  title: Общие числа
  level: 3
  required: true
  homework: false
  mcko: []
  statement: |
    Даны две строки с целыми числами через пробел. Выведите числа, которые есть в обеих строках, по возрастанию, каждое на своей строке (без повторов). Если общих чисел нет, выведите «Пусто».
  input_format: Две строки с числами через пробел.
  output_format: Столбец чисел или слово «Пусто».
  starter: |
    a = set()
    for word in input().split():
        a.add(int(word))
    b = set()
    for word in input().split():
        b.add(int(word))
    # найди общие
  examples:
  - &id013 {input: '1 2 3

      2 3 4', output: '2

      3'}
  - &id014 {input: '1 2

      3 4', output: Пусто}
  tests:
  - *id013
  - *id014
  - {input: '5 5 5

      5', output: '5', hidden: true}
  - {input: '1 2 3 4 5

      5 4 3 2 1', output: '1

      2

      3

      4

      5', hidden: true}
  - {input: '-1 0 1

      1 0', output: '0

      1', hidden: true}
  - {input: '7

      7 7', output: '7', hidden: true}
  checker: exact
  hints:
  - 'Пересечение множеств: a & b.'
  - 'Выводи по возрастанию: sorted(a & b).'
  - Если пересечение пусто, len(a & b) == 0.
  solution: |
    a = set()
    for word in input().split():
        a.add(int(word))
    b = set()
    for word in input().split():
        b.add(int(word))
    common = a & b
    if len(common) == 0:
        print("Пусто")
    else:
        for x in sorted(common):
            print(x)
  explanation: |
    Чтение чисел из строки в множество и пересечение.
- id: l12-t8
  type: code
  title: Второе по величине
  level: 3
  required: true
  homework: false
  mcko: []
  statement: |
    Дана строка с целыми числами. Среди них есть хотя бы два различных. Выведите второе по величине различное число (например, в 5 9 9 3 это 5).
  input_format: Одна строка с числами через пробел.
  output_format: Одно число.
  starter: |
    numbers = []
    for word in input().split():
        numbers.append(int(word))
    # второе по величине различное
  examples:
  - &id015 {input: 5 9 9 3, output: '5'}
  - &id016 {input: 1 2, output: '1'}
  tests:
  - *id015
  - *id016
  - {input: 7 7 3, output: '3', hidden: true}
  - {input: 10 20 30 40, output: '30', hidden: true}
  - {input: -5 -1 -1 -9, output: '-5', hidden: true}
  - {input: 4 4 4 5 5, output: '4', hidden: true}
  checker: exact
  hints:
  - Повторы убирает множество.
  - 'Отсортируй: sorted(set(numbers)).'
  - Второе с конца — индекс -2.
  solution: |
    numbers = []
    for word in input().split():
        numbers.append(int(word))
    unique = sorted(set(numbers))
    print(unique[-2])
  explanation: |
    `set` + `sorted` + индекс -2. Типичная ловушка — повторы максимума.
- id: l12-t9
  type: code
  title: Сдвиг списка
  level: 4
  required: false
  homework: true
  mcko: []
  statement: |
    Дана строка с числами и число k. Сдвиньте числа вправо на k позиций по кругу (последние k становятся первыми). Выведите результат через пробел в одной строке.
  input_format: Первая строка — числа через пробел, вторая — k (k ≥ 0).
  output_format: Одна строка.
  starter: |
    words = input().split()
    k = int(input())
    # сдвиг по кругу
  examples:
  - &id017 {input: '1 2 3 4 5

      2', output: 4 5 1 2 3}
  - &id018 {input: '1 2 3

      0', output: 1 2 3}
  tests:
  - *id017
  - *id018
  - {input: '1 2 3

      3', output: 1 2 3, hidden: true}
  - {input: '1 2 3 4

      6', output: 3 4 1 2, hidden: true}
  - {input: '7

      10', output: '7', hidden: true}
  - {input: 'a b c d e f

      1', output: f a b c d e, hidden: true}
  checker: tokens
  hints:
  - Сначала k %= len(words), чтобы не сдвигать лишних кругов.
  - Последние k элементов — words[len(words) - k:], остальные — words[:len(words) - k].
  - Склей два списка через + и выведи через " ".join(...).
  solution: |
    words = input().split()
    k = int(input())
    k %= len(words)
    n = len(words)
    result = words[n - k:] + words[:n - k]
    print(" ".join(result))
  explanation: |
    Звёздочка: срезы, `+` для списков, `join`. Слова оставляем строками, поэтому join работает без `str`.
