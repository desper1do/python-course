  checker: exact
  hints:
  - itertools.permutations("wxyz") даёт 24 порядка.
  - 'Значение переменной v в строке row: int(row[order.index(v)]).'
  - 'Импликация y → z пишется (not y) or z. Вся функция: (w and not x) or (x and ((not y) or z)).'
  solution: |
    import itertools
    k = int(input())
    rows = []
    for i in range(k):
        rows.append(input().split())
    for order in itertools.permutations("wxyz"):
        ok = True
        for row in rows:
            w = int(row[order.index("w")])
            x = int(row[order.index("x")])
            y = int(row[order.index("y")])
            z = int(row[order.index("z")])
            if not ((w and not x) or (x and ((not y) or z))):
                ok = False
        if ok:
            print("".join(order))
  explanation: |
    Звёздочка: те же перестановки, но четыре переменные. Перебор 24 вариантов программа делает мгновенно, руками — долго.
