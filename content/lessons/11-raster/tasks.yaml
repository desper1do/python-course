- id: l11-t4
  type: code
  title: Объём в байтах
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Найдите объём изображения в байтах. Если число бит не делится на 8, округлите вверх.
  input_format: Три строки — w, h, i.
  output_format: Одно число — байты.
  starter: |
    w = int(input())
    h = int(input())
    i = int(input())
    # биты, потом байты с округлением вверх
  examples:
  - &id007 {input: '100

      50

      8', output: '5000'}
  - &id008 {input: '10

