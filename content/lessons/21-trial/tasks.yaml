      768

      3

      0', output: '1'}
  - &id008 {input: '640

      480

      900

      8', output: '65536'}
  tests:
  - *id007
  - *id008
  - {input: '100

      100

      30

      4', output: '1048576', hidden: true}
  - {input: '200

      200

      80

      16', output: '1', hidden: true}
  - {input: '32

      32

      3

      8', output: '65536', hidden: true}
  - {input: '500

      400

      590

      8', output: '65536', hidden: true}
  - {input: '1000

      1000

      3000

      8', output: '65536', hidden: true}
  checker: exact
  hints:
