- id: l12-t4
  type: code
  title: Больше среднего
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Вводится n, затем n целых чисел по одному на строке. Сколько из них строго больше среднего арифметического всех чисел?
  input_format: Первая строка — n, затем n чисел.
  output_format: Одно число.
  starter: |
    n = int(input())
    numbers = []
    # прочитай список
  examples:
  - &id007 {input: '4

      1

      2

      3

      4', output: '2'}
  - &id008 {input: '3

      5

      5

      5', output: '0'}
  tests:
  - *id007
  - *id008
  - {input: '1

      10', output: '0', hidden: true}
  - {input: '4

      1

      1

      1

      10', output: '1', hidden: true}
  - {input: '4

      -3

      0

      3

      6', output: '2', hidden: true}
  - {input: '5

      2

      3

      100

      4

      5', output: '1', hidden: true}
  checker: exact
  hints:
  - 'Среднее: sum(numbers) / len(numbers).'
  - Пройди по списку и посчитай числа больше среднего.
  solution: |
    n = int(input())
    numbers = []
    for i in range(n):
        numbers.append(int(input()))
    average = sum(numbers) / len(numbers)
    count = 0
    for x in numbers:
        if x > average:
            count += 1
    print(count)
  explanation: |
    Два прохода: сначала среднее, потом счётчик. Без списка так не сделать.
