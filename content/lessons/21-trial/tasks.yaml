- id: l21-t1
  type: code
  title: №1. Коды Фано
  level: 3
  required: true
  homework: false
  mcko:
  - 1
  statement: |
    В сообщении используются n букв. Для каждой дано число вхождений. Коды известны всем буквам, кроме одной или двух (вместо кода «?»). Известные коды удовлетворяют условию Фано. Выберите недостающие коды так, чтобы условие Фано выполнялось, а длина сообщения была минимальной. Выведите эту длину. Достаточно проверять коды длиной до 6.
  input_format: Первая строка — n. Затем n строк «буква код количество», у одной или двух букв код заменён «?».
  output_format: Одно число.
  starter: |
    n = int(input())
    # твой код
  examples:
  - &id001 {input: '3

      A 0 12

      B 10 7

      C ? 3', output: '32'}
  - &id002 {input: '4

      A 1 8

      B 00 6

      C ? 5

      D ? 2', output: '41'}
  tests:
  - *id001
  - *id002
  - {input: '4

      A 01 3

      B 10 3

      C 000 4

      D ? 9', output: '42', hidden: true}
  - {input: '4

      A 0 20

      B 100 5

      C ? 7

      D ? 6', output: '67', hidden: true}
  - {input: '4

      A 11 5

      B 10 5

      C ? 6

      D ? 1', output: '34', hidden: true}
  - {input: '4

      A 0 1

      B 10 1

      C 110 1

      D ? 30', output: '96', hidden: true}
  - {input: '5

      A 00 7

      B 01 4

      C ? 3

      D ? 3

      E 11 1', output: '42', hidden: true}
  checker: exact
  hints:
  - Известные коды и сумма их вклада — отдельно. Для «?» запомни частоты.
  - 'Свободные коды: перебор строк из 0 и 1 до длины 6, отсеять конфликтующие с известными.'
  - Если неизвестная одна — перебери свободные коды; если две — вложенный цикл с проверкой конфликта между ними.
  solution: |
    def all_codes(n):
        result = []
        for length in range(1, n + 1):
            for number in range(2 ** length):
                code = bin(number)[2:]
                while len(code) < length:
                    code = "0" + code
                result.append(code)
        return result

    def conflicts(a, b):
        return a.startswith(b) or b.startswith(a)

    n = int(input())
    known = []
    base = 0
    freqs = []
    for k in range(n):
        parts = input().split()
        count = int(parts[2])
        if parts[1] == "?":
            freqs.append(count)
        else:
            known.append(parts[1])
            base += len(parts[1]) * count
    free = []
    for candidate in all_codes(6):
        ok = True
        for c in known:
            if conflicts(candidate, c):
                ok = False
        if ok:
            free.append(candidate)
    best = 10 ** 9
    if len(freqs) == 1:
        for c1 in free:
            total = base + len(c1) * freqs[0]
            if total < best:
                best = total
    else:
        for c1 in free:
            for c2 in free:
                if not conflicts(c1, c2):
                    total = base + len(c1) * freqs[0] + len(c2) * freqs[1]
                    if total < best:
                        best = total
    print(best)
  explanation: |
    Сквозной перебор по шаблону урока 16.
- id: l21-t2
  type: code
  title: №2. Автомат
  level: 3
  required: true
  homework: false
  mcko:
  - 2
  statement: |
    Автомат: записывает N в двоичной системе. Если N кратно 3, справа дописывается 01, иначе 10. Затем то же действие повторяется ещё раз для числа, записанного получившейся двоичной записью. Результат R — десятичное значение итоговой записи. Найдите наименьшее натуральное N, при котором R больше X.
  input_format: Одна строка — число X.
  output_format: Число N.
  starter: |
    x = int(input())
    # твой код
  examples:
  - &id003 {input: '100', output: '6'}
  - &id004 {input: '1', output: '1'}
  tests:
  - *id003
  - *id004
  - {input: '1000', output: '62', hidden: true}
  - {input: '50', output: '3', hidden: true}
  - {input: '500', output: '31', hidden: true}
  - {input: '10000', output: '625', hidden: true}
  - {input: '7', output: '1', hidden: true}
  checker: exact
  hints:
  - 'Цикл while: пробуй N = 1, 2, 3, … пока R не станет больше X.'
  - 'Внутри цикла выполни шаг два раза: s = bin(n)[2:]; дважды: v = int(s, 2); если v % 3 == 0, s += "01", иначе s += "10".'
  - R = int(s, 2).
  solution: |
    x = int(input())
    n = 0
    r = 0
    while r <= x:
        n += 1
        s = bin(n)[2:]
        for step in range(2):
            v = int(s, 2)
            if v % 3 == 0:
                s += "01"
            else:
                s += "10"
        r = int(s, 2)
    print(n)
  explanation: |
    Новое правило, тот же приём «первое подходящее». Во втором шаге кратность проверяется для нового числа.
- id: l21-t3
  type: code
  title: №3. Сумма в разных системах
  level: 3
  required: true
  homework: false
  mcko:
  - 3
  statement: |
    Первое число записано в двоичной системе и может иметь дробную часть (через точку), второе — целое в шестнадцатеричной. Найдите сумму и выведите её в десятичной системе.
  input_format: Две строки — двоичное число и шестнадцатеричное число (цифры 0–9 и A–F).
  output_format: Десятичное число (дробное).
  starter: |
    first = input()
    second = input()
    # твой код
  examples:
  - &id005 {input: '101.011

      1F', output: '36.375'}
  - &id006 {input: '1.1

      1', output: '2.5'}
  tests:
  - *id005
  - *id006
  - {input: '0.0001

      A', output: '10.0625', hidden: true}
  - {input: '1111.1

      FF', output: '270.5', hidden: true}
  - {input: '10.01

      0', output: '2.25', hidden: true}
  - {input: '11111111.11

      100', output: '511.75', hidden: true}
  - {input: '0.101

      3', output: '3.625', hidden: true}
  checker: float
  hints:
  - 'Разрежь первое число по точке: first.split(".").'
  - 'Целая часть: int(часть, 2). Дробная: веса 1/2, 1/4, 1/8 (урок 15).'
  - Добавь int(second, 16).
  solution: |
    first = input()
    second = input()
    parts = first.split(".")
    result = int(parts[0], 2)
    if len(parts) == 2:
        weight = 0.5
        for ch in parts[1]:
            if ch == "1":
                result += weight
            weight /= 2
    result += int(second, 16)
    print(result)
  explanation: |
    Арифметика с дробью: приводим к десятичной.
- id: l21-t4
  type: code
