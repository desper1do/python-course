    n = int(input())
    numbers = []
    for i in range(n):
        numbers.append(int(input()))
    N = 10 ** 9
    for x in numbers:
        if x % 15 != 0 and x < N:
            N = x
    count = 0
    best = 10 ** 9
    for i in range(len(numbers) - 1):
        p = numbers[i]
        q = numbers[i + 1]
        s = p + q
        if s % N == 0 and (p > 100 or q > 100):
            count += 1
            if s < best:
                best = s
    print(count, best)
