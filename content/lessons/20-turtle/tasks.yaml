  title: Точки внутри фигуры
  level: 3
  required: true
  homework: false
  mcko:
  - 10
  statement: |
    Программа рисует прямоугольник. Сколько точек с целыми координатами лежит строго внутри него? Функция `bounding_box(line)` возвращает x_min, y_min, x_max, y_max нарисованного (используйте её).
  input_format: Одна строка с программой.
