  title: Степени двойки
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Выведите все степени двойки (1, 2, 4, 8, …), которые не больше n, каждую на своей строке.
  input_format: Одна строка — целое число n (n ≥ 1).
  output_format: Столбец чисел.
  starter: |
    n = int(input())
    p = 1
    # пока p не больше n: выведи p и удвой p
  examples:
  - &id007 {input: '10', output: '1

      2

      4

      8'}
  - &id008 {input: '1', output: '1'}
  tests:
  - *id007
  - *id008
  - {input: '100', output: '1

      2

      4

      8

      16

      32

      64', hidden: true}
  - {input: '2', output: '1

      2', hidden: true}
  - {input: '64', output: '1

      2

      4

      8

      16

      32

      64', hidden: true}
  - {input: '1000', output: '1

      2

      4

      8

      16

      32

      64

      128

      256

      512', hidden: true}
