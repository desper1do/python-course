  hints:
  - 'Для N: условие x % 7 == 0 и x < N.'
  - 'Пара подходит: p % N != 0 and q % N != 0 and (p * q) % N == 0.'
  - 'Максимум произведения: best.'
  solution: |
    n = int(input())
    numbers = []
    for i in range(n):
        numbers.append(int(input()))
    N = 10 ** 9
    for x in numbers:
        if x % 7 == 0 and x < N:
            N = x
    count = 0
    best = 0
    for i in range(len(numbers) - 1):
        p = numbers[i]
        q = numbers[i + 1]
        if p % N != 0 and q % N != 0 and (p * q) % N == 0:
            count += 1
            if p * q > best:
                best = p * q
    print(count, best)
  explanation: |
    Новое условие, тот же скелет. Хорошо видно, что задача 13 — шаблон.
