- id: l07-t5
  type: code
  title: Сколько цифр
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Дано натуральное число. Определите, сколько в нём цифр. Решите циклом, не используя `len`.
  input_format: Одна строка — целое число n (n ≥ 1).
  output_format: Одно число.
  starter: |
    n = int(input())
    count = 0
    # отрезай по цифре, пока число не станет 0
  examples:
  - &id009 {input: '482', output: '3'}
  - &id010 {input: '5', output: '1'}
  tests:
  - *id009
  - *id010
  - {input: '10', output: '2', hidden: true}
  - {input: '12345', output: '5', hidden: true}
  - {input: '999999', output: '6', hidden: true}
  - {input: '100', output: '3', hidden: true}
  - {input: '1000000000', output: '10', hidden: true}
  checker: exact
  hints:
  - Каждый раз делай n //= 10 и увеличивай счётчик на 1.
  - 'Цикл: while n > 0.'
  solution: |
    n = int(input())
    count = 0
    while n > 0:
        count += 1
        n //= 10
    print(count)
  explanation: |
    Первое использование цикла по цифрам.
- id: l07-t6
  type: code
  title: Сумма цифр
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Найдите сумму цифр неотрицательного числа.
  input_format: Одна строка — целое число n (n ≥ 0).
  output_format: Одно число.
  starter: |
    n = int(input())
    total = 0
    # складывай последние цифры
  examples:
  - &id011 {input: '482', output: '14'}
  - &id012 {input: '0', output: '0'}
  tests:
  - *id011
  - *id012
  - {input: '7', output: '7', hidden: true}
  - {input: '1000', output: '1', hidden: true}
  - {input: '99999', output: '45', hidden: true}
  - {input: '123456789', output: '45', hidden: true}
  - {input: '101', output: '2', hidden: true}
  checker: exact
  hints:
  - Последняя цифра — n % 10; добавь её к total.
  - 'Потом отрежь цифру: n //= 10.'
  solution: |
    n = int(input())
    total = 0
    while n > 0:
        total += n % 10
        n //= 10
    print(total)
  explanation: |
    Классика. Для 0 цикл не выполнится, и ответ 0 — это верно.
- id: l07-t7
  type: code
  title: Сумма до нуля
  level: 3
  required: true
  homework: false
  mcko: []
  statement: |
    Вводятся целые числа по одному в строке. Ввод заканчивается числом 0 (его в сумму не включать). Выведите сумму введённых чисел.
  input_format: Несколько строк — целые числа, последняя строка 0.
  output_format: Одно число.
  starter: |
    x = int(input())
    total = 0
    # пока x не 0: добавь x и считай следующее
  examples:
  - &id013 {input: '5

      3

      0', output: '8'}
  - &id014 {input: '0', output: '0'}
  tests:
  - *id013
  - *id014
  - {input: '1

      2

      3

      4

      0', output: '10', hidden: true}
  - {input: '-5

      5

      0', output: '0', hidden: true}
  - {input: '100

      0', output: '100', hidden: true}
  - {input: '7

      -3

      10

      0', output: '14', hidden: true}
  checker: exact
  hints:
  - 'Условие цикла: x != 0.'
  - 'Внутри: добавь x в total и снова x = int(input()).'
  - Первое число прочитано до цикла.
  solution: |
    x = int(input())
    total = 0
    while x != 0:
        total += x
        x = int(input())
    print(total)
  explanation: |
    Цикл «читаем, пока не 0». Нужно прочитать первое число до цикла и следующее — в конце тела.
- id: l07-t8
  type: code
  title: Делится на 2
  level: 3
  required: true
  homework: false
  mcko: []
  statement: |
    Сколько раз можно поделить число на 2 нацело, пока оно чётное?
  input_format: Одна строка — целое число n (n ≥ 1).
  output_format: Одно число.
  starter: |
    n = int(input())
    count = 0
    # пока n чётное: дели и считай
  examples:
  - &id015 {input: '8', output: '3'}
  - &id016 {input: '12', output: '2'}
  tests:
  - *id015
  - *id016
  - {input: '7', output: '0', hidden: true}
  - {input: '1', output: '0', hidden: true}
  - {input: '1024', output: '10', hidden: true}
  - {input: '96', output: '5', hidden: true}
  - {input: '80', output: '4', hidden: true}
  checker: exact
  hints:
  - 'Условие цикла: n % 2 == 0.'
  - Внутри n //= 2 и count += 1.
  solution: |
    n = int(input())
    count = 0
    while n % 2 == 0:
        n //= 2
        count += 1
    print(count)
  explanation: |
    Условие цикла — не счётчик, а свойство числа. Пригодится в системах счисления и разложении на множители.
- id: l07-t9
  type: code
  title: Число наоборот
  level: 4
  required: false
  homework: true
  mcko: []
  statement: |
    Выведите число, записанное теми же цифрами в обратном порядке (нули в начале пропадают: из 1200 получится 21). Решите циклом.
  input_format: Одна строка — целое число n (n ≥ 0).
  output_format: Одно число.
  starter: |
    n = int(input())
    result = 0
    # вынимай цифры с конца и дописывай в result
  examples:
  - &id017 {input: '123', output: '321'}
  - &id018 {input: '1200', output: '21'}
  tests:
  - *id017
  - *id018
  - {input: '5', output: '5', hidden: true}
  - {input: '100000', output: '1', hidden: true}
  - {input: '907', output: '709', hidden: true}
  - {input: '1000000007', output: '7000000001', hidden: true}
  - {input: '0', output: '0', hidden: true}
  checker: exact
  hints:
  - Цифру с конца берём как n % 10.
  - 'Дописать цифру к result справа: result = result * 10 + digit.'
  - Потом n //= 10.
  solution: |
    n = int(input())
    result = 0
    while n > 0:
        result = result * 10 + n % 10
        n //= 10
    print(result)
  explanation: |
    Звёздочка: идея «сдвигаем result и дописываем цифру». Сравните с задачей 7 из урока 2.
