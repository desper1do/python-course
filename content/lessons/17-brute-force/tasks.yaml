- id: l17-t9
  type: code
  title: 'МЦКО-8: найти d'
  level: 3
  required: true
  homework: false
  mcko:
  - 8
  statement: |
    В RSA даны простые числа p и q и число e. Найдите такое d из диапазона от lo до hi включительно, что (d·e) mod f = 1, где f = (p − 1)·(q − 1). Гарантируется, что подходящее d есть; если их несколько, выведите наименьшее.
  input_format: Пять строк — p, q, e, lo, hi.
  output_format: Число d.
  starter: |
    p = int(input())
    q = int(input())
    e = int(input())
    lo = int(input())
    hi = int(input())
    f = (p - 1) * (q - 1)
    answer = 0
    # перебери d от hi до lo, запомни подходящее
  examples:
  - &id017 {input: '11

      13

      7

      1

      200', output: '103'}
  - &id018 {input: '3

      11

      3

      1

      20', output: '7'}
  tests:
  - *id017
  - *id018
  - {input: '5

      7

      5

      1

      30', output: '5', hidden: true}
  - {input: '7

      11

      7

      40

      50', output: '43', hidden: true}
  - {input: '13

      17

      5

      1

      190', output: '77', hidden: true}
  - {input: '11

      13

      7

      100

      110', output: '103', hidden: true}
  - {input: '17

      19

      5

      1

      300', output: '173', hidden: true}
  checker: exact
  hints:
  - Цикл for d in range(lo, hi + 1).
  - Если d * e % f == 1 — запомни d.
  - 'Нужно наименьшее: перебирай от hi вниз (range(hi, lo - 1, -1)) и перезаписывай answer — после цикла в answer будет наименьшее. Либо используй флаг.'
  solution: |
    p = int(input())
    q = int(input())
    e = int(input())
    lo = int(input())
    hi = int(input())
    f = (p - 1) * (q - 1)
    answer = 0
    for d in range(hi, lo - 1, -1):
        if d * e % f == 1:
            answer = d
    print(answer)
  explanation: |
    Полная задача МЦКО-8. Идём сверху вниз, чтобы последнее запомненное d было наименьшим. Допустим и вариант с флагом.
