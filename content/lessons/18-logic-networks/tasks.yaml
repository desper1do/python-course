- id: l18-t4
  type: code
  title: Сколько наборов дают 1
  level: 2
  required: true
  homework: false
  mcko:
  - 5
  statement: |
    Функция F(x, y) = ((x → y) ∧ v) ∨ (x ∧ ¬w) ∨ (y ∧ u). Значения v, w, u даны. Сколько из четырёх пар (x, y) дают F = 1?
  input_format: Три строки — v, w, u (0 или 1).
  output_format: Число от 0 до 4.
  starter: |
    v = int(input())
    w = int(input())
    u = int(input())
    count = 0
    # вложенные циклы по x и y
  examples:
  - &id007 {input: '0

      0

      0', output: '2'}
  - &id008 {input: '1

      1

      1', output: '3'}
  tests:
  - *id007
  - *id008
  - {input: '1

      0

      0', output: '4', hidden: true}
  - {input: '0

      1

      0', output: '0', hidden: true}
  - {input: '0

      0

      1', output: '3', hidden: true}
  - {input: '1

      1

      0', output: '3', hidden: true}
  - {input: '0

      1

      1', output: '2', hidden: true}
  checker: exact
  hints:
  - 'Два вложенных цикла: for x in range(2): for y in range(2):.'
  - 'Условие: ((not x) or y) and v, или x and not w, или y and u.'
  - Если истинно, count += 1.
  solution: |
    v = int(input())
    w = int(input())
    u = int(input())
    count = 0
    for x in range(2):
        for y in range(2):
            if (((not x) or y) and v) or (x and not w) or (y and u):
                count += 1
    print(count)
  explanation: |
    Перебор всех наборов — основа таблицы истинности.
- id: l18-t5
  type: code
  title: 'МЦКО-5: два столбца'
  level: 2
  required: true
  homework: false
  mcko:
  - 5
  statement: |
    Функция F(x, y) = ¬x ∨ y. В таблице истинности показаны несколько строк, где F = 1, но столбцы не подписаны (первый столбец и второй). Определите, какой переменной соответствует каждый столбец. Выведите буквы в порядке столбцов: «xy» или «yx». Ответ единственный.
  input_format: Первая строка — число строк k, затем k строк по два значения (0 или 1).
  output_format: Строка «xy» или «yx».
  starter: |
    import itertools
    k = int(input())
    rows = []
    for i in range(k):
        rows.append(input().split())
    # попробуй оба порядка
  examples:
  - &id009 {input: '1

      0 1', output: xy}
  - &id010 {input: '1

      1 0', output: yx}
  tests:
  - *id009
  - *id010
  - {input: '2

      0 0

      0 1', output: xy, hidden: true}
  - {input: '2

      1 1

      1 0', output: yx, hidden: true}
  - {input: '3

      0 1

      1 1

      0 0', output: xy, hidden: true}
  - {input: '2

      1 0

      0 0', output: yx, hidden: true}
  - {input: '2

      0 1

      1 1', output: xy, hidden: true}
  checker: exact
  hints:
  - 'Перебери порядки: itertools.permutations("xy") даёт кортежи ("x", "y") и ("y", "x").'
  - 'Значение x в строке row: int(row[order.index("x")]).'
  - 'Порядок подходит, если во всех строках (not x) or y истинно. Вывести: "".join(order).'
  solution: |
    import itertools
    k = int(input())
    rows = []
    for i in range(k):
        rows.append(input().split())
    for order in itertools.permutations("xy"):
        ok = True
        for row in rows:
            x = int(row[order.index("x")])
            y = int(row[order.index("y")])
            if not ((not x) or y):
                ok = False
        if ok:
            print("".join(order))
  explanation: |
    Разбор вручную: строка (0, 1) годится только если первый столбец — x. Затем программа.
