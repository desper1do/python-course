  homework: false
  mcko:
  - 4
  statement: |
    Цвет пикселя кодируется i битами, ещё a бит отводится на прозрачность. Найдите объём изображения w × h в байтах (округлите вверх).
  input_format: Четыре строки — w, h, i, a.
  output_format: Одно число — байты.
  starter: |
    w = int(input())
    h = int(input())
    i = int(input())
    a = int(input())
    # на пиксель i + a бит
  examples:
  - &id011 {input: '100

      100

      24

      8', output: '40000'}
  - &id012 {input: '10

      10

      8

      0', output: '100'}
  tests:
  - *id011
  - *id012
  - {input: '640

      480

      16

      2', output: '691200', hidden: true}
  - {input: '3

      3

      1

      1', output: '3', hidden: true}
  - {input: '1

      1

      24

