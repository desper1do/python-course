- id: l15-t1
  type: code
  title: Двоичная дробь в десятичную
  level: 1
  required: true
  homework: false
  mcko:
  - 3
  statement: |
    Дана цифры двоичной дроби после точки: например, 101 означает 0.101₂. Выведите её значение в десятичной системе.
  input_format: Одна строка из нулей и единиц.
  output_format: Десятичная дробь.
  starter: |
    s = input()
    result = 0
    weight = 0.5
    # каждый разряд — вдвое меньше предыдущего
  examples:
  - &id001 {input: '1', output: '0.5'}
  - &id002 {input: '01', output: '0.25'}
  tests:
  - *id001
  - *id002
  - {input: '101', output: '0.625', hidden: true}
  - {input: '0', output: '0.0', hidden: true}
  - {input: '111', output: '0.875', hidden: true}
  - {input: '0011', output: '0.1875', hidden: true}
  checker: float
  hints:
  - Идём по цифрам слева направо; вес первого разряда 0.5, потом 0.25 и так далее.
  - Если цифра равна "1", прибавь weight к result. После каждой цифры weight /= 2.
  solution: |
    s = input()
    result = 0
    weight = 0.5
    for ch in s:
        if ch == "1":
            result += weight
        weight /= 2
    print(result)
  explanation: |
    Веса 1/2, 1/4, 1/8 — точные двоичные дроби, ошибок округления нет.
- id: l15-t2
  type: code
  title: Сумма из трёх систем
  level: 1
  required: true
  homework: false
  mcko:
  - 3
  statement: |
    Даны три числа: первое двоичное, второе восьмеричное, третье шестнадцатеричное. Выведите их сумму в десятичной системе.
  input_format: Три строки — числа в системах 2, 8 и 16.
  output_format: Одно число.
  starter: |
    a = input()
    b = input()
    c = input()
    # int(строка, основание)
  examples:
  - &id003 {input: '101

      7

      A', output: '22'}
  - &id004 {input: '1

      1

      1', output: '3'}
  tests:
  - *id003
  - *id004
  - {input: '11111111

      377

      FF', output: '765', hidden: true}
  - {input: '0

      0

      0', output: '0', hidden: true}
  - {input: '1000

      10

      10', output: '32', hidden: true}
  - {input: '1111

      77

      FFF', output: '4173', hidden: true}
  checker: exact
  hints:
  - 'Каждое число переведи: int(a, 2), int(b, 8), int(c, 16).'
  - Сложи три значения.
  solution: |
    a = input()
    b = input()
    c = input()
    print(int(a, 2) + int(b, 8) + int(c, 16))
  explanation: |
    Тип МЦКО-3 в простом виде.
- id: l15-t3
  type: code
  title: Дополнительный код
  level: 1
  required: true
  homework: false
  mcko:
  - 12
  statement: |
    Дано число n от 1 до 128. Выведите 8-битный дополнительный код числа −n.
  input_format: Одна строка — целое число n.
  output_format: Строка из 8 символов.
  starter: |
    n = int(input())
    # код числа -n это запись числа 256 - n
  examples:
  - &id005 {input: '5', output: '11111011'}
  - &id006 {input: '1', output: '11111111'}
  tests:
  - *id005
  - *id006
  - {input: '128', output: '10000000', hidden: true}
  - {input: '127', output: '10000001', hidden: true}
  - {input: '100', output: '10011100', hidden: true}
  - {input: '64', output: '11000000', hidden: true}
  checker: exact
  hints:
  - Код числа −n — двоичная запись числа 256 − n.
  - print(bin(256 - n)[2:])
  solution: |
    n = int(input())
    print(bin(256 - n)[2:])
  explanation: |
    Покажите вручную для 5: 00000101 → 11111010 → 11111011.
- id: l15-t4
  type: code
  title: Число по дополнительному коду
  level: 2
  required: true
  homework: false
  mcko:
  - 12
  statement: |
    Дан 8-битный код числа в дополнительном коде. Выведите это число (оно может быть отрицательным).
  input_format: Одна строка из 8 нулей и единиц.
  output_format: Одно целое число.
  starter: |
    code = input()
    # если первый бит 1, число отрицательное
  examples:
  - &id007 {input: '11111011', output: '-5'}
  - &id008 {input: '00000101', output: '5'}
  tests:
  - *id007
  - *id008
  - {input: '10000000', output: '-128', hidden: true}
  - {input: '01111111', output: '127', hidden: true}
  - {input: '11111111', output: '-1', hidden: true}
  - {input: '00000000', output: '0', hidden: true}
  - {input: '11100010', output: '-30', hidden: true}
  checker: exact
  hints:
  - 'Сначала получи значение кода: int(code, 2).'
  - 'Если код начинается с 1 (code[0] == "1"), число отрицательное: из значения вычти 256.'
  solution: |
    code = input()
    value = int(code, 2)
    if code[0] == "1":
        value -= 256
    print(value)
  explanation: |
    Обратная задача для МЦКО-12.
- id: l15-t5
  type: code
  title: Дробь в двоичную
  level: 2
  required: true
  homework: false
  mcko:
  - 3
  statement: |
    Правильная дробь p/q, где q — степень двойки, записывается конечной двоичной дробью. Выведите цифры после точки.
  input_format: Две строки — p и q (0 < p < q).
  output_format: Строка из нулей и единиц.
  starter: |
    p = int(input())
    q = int(input())
    bits = ""
    # умножай на 2, пока не останется 0
  examples:
  - &id009 {input: '5

      8', output: '101'}
  - &id010 {input: '1

      2', output: '1'}
  tests:
  - *id009
  - *id010
  - {input: '3

      4', output: '11', hidden: true}
  - {input: '1

      16', output: '0001', hidden: true}
  - {input: '3

      16', output: '0011', hidden: true}
  - {input: '7

      8', output: '111', hidden: true}
  - {input: '1

      1024', output: '0000000001', hidden: true}
  checker: exact
  hints:
  - 'Пока p != 0: удвой p (p *= 2).'
  - Если p >= q, цифра 1 и p -= q, иначе цифра 0.
  - Цифры дописывай справа.
  solution: |
    p = int(input())
    q = int(input())
    bits = ""
    while p != 0:
        p *= 2
        if p >= q:
            bits += "1"
            p -= q
        else:
            bits += "0"
    print(bits)
  explanation: |
    Пример из теории с вводом. Цикл заканчивается, потому что q — степень двойки.
- id: l15-t6
  type: code
  title: Сложение в системе b
  level: 2
  required: true
  homework: false
  mcko:
  - 3
  statement: |
    Даны основание b (2 ≤ b ≤ 16) и два числа в этой системе. Выведите их сумму в той же системе (цифры A–F заглавные).
  input_format: Три строки — b, первое число, второе число.
  output_format: Сумма в системе b.
  starter: |
    digits = "0123456789ABCDEF"
    b = int(input())
    x = input()
    y = input()
    # сумма через десятичную, потом обратно
  examples:
  - &id011 {input: '2

      1011

      110', output: '10001'}
  - &id012 {input: '8

      777

      1', output: '1000'}
  tests:
  - *id011
  - *id012
  - {input: '16

      FF

      1', output: '100', hidden: true}
  - {input: '12

      AB

      B', output: BA, hidden: true}
  - {input: '5

      44

      1', output: '100', hidden: true}
  - {input: '3

      2

      2', output: '11', hidden: true}
  - {input: '16

      0

      0', output: '0', hidden: true}
  checker: exact
  hints:
  - 'Переведи: int(x, b), int(y, b), сложи.'
  - 'Обратно: деление с остатком и digits[...] (урок 14). Не забудь случай суммы 0.'
  - Цифры дописывай слева.
  solution: |
    digits = "0123456789ABCDEF"
    b = int(input())
    x = input()
    y = input()
    n = int(x, b) + int(y, b)
    result = ""
    if n == 0:
        result = "0"
    while n > 0:
        result = digits[n % b] + result
        n //= b
    print(result)
  explanation: |
    Собираем уроки 14 и 15: int(s, b) и ручной перевод обратно.
- id: l15-t7
  type: code
  title: Неизвестная цифра в системе 12
  level: 3
  required: true
  homework: false
  mcko:
  - 11
  statement: |
    Число записано в системе с основанием 12 цифрами 0–9, A (10), B (11) и содержит одну неизвестную цифру x (строчная буква x). Найдите наименьшее значение цифры, при котором число делится на 13. Выведите эту цифру, а на следующей строке частное от деления числа на 13 в десятичной системе. Решение гарантированно существует.
  input_format: Одна строка — запись числа.
  output_format: 'Две строки: цифра и частное.'
  starter: |
    digits = "0123456789AB"
    s = input()
    # переберите цифры
  examples:
  - &id013 {input: 3x5, output: '8

      41'}
  - &id014 {input: 6x8, output: '1

      68'}
  tests:
  - *id013
  - *id014
  - {input: x15, output: '9

      101', hidden: true}
  - {input: A1x, output: '4

      112', hidden: true}
  - {input: 2x9, output: 'B

      33', hidden: true}
  - {input: x00, output: '0

      0', hidden: true}
  - {input: 1Bx, output: 'A

      22', hidden: true}
  - {input: BBx, output: '0

      132', hidden: true}
  checker: exact
  hints:
  - 'Для каждой цифры d из digits замени x: s.replace("x", d).'
  - 'Значение: int(..., 12).'
  - 'Заведи флаг found = False. Если value % 13 == 0 и not found: выведи d и value // 13, потом found = True. Тогда выведется только наименьшая цифра.'
  solution: |
    digits = "0123456789AB"
    s = input()
    found = False
    for d in digits:
        value = int(s.replace("x", d), 12)
        if value % 13 == 0 and not found:
            print(d)
            print(value // 13)
            found = True
  explanation: |
    Полный разбор МЦКО-11 в одном перебое. Флаг `found` нужен, чтобы остановиться на первой подходящей цифре (наименьшей).
- id: l15-t8
  type: code
  title: Код суммы
  level: 3
  required: true
  homework: false
  mcko:
  - 12
  statement: |
    Даны два целых числа a и b от −128 до 127, их сумма тоже лежит в этом диапазоне. Выведите 8-битный дополнительный код суммы a + b (для неотрицательных — обычная двоичная запись, дополненная нулями слева до 8 бит).
  input_format: Две строки — a и b.
  output_format: Строка из 8 символов.
  starter: |
    a = int(input())
    b = int(input())
    s = a + b
    # для отрицательных прибавь 256, для остальных оставь
  examples:
  - &id015 {input: '5

      -3', output: '00000010'}
  - &id016 {input: '-100

      -28', output: '10000000'}
  tests:
  - *id015
  - *id016
  - {input: '0

      0', output: '00000000', hidden: true}
  - {input: '127

      -127', output: '00000000', hidden: true}
  - {input: '-1

      -1', output: '11111110', hidden: true}
  - {input: '100

      27', output: '01111111', hidden: true}
  - {input: '-50

      20', output: '11100010', hidden: true}
  checker: exact
  hints:
  - Если сумма s отрицательна, её код — двоичная запись s + 256.
  - 'Запись bin(...)[2:] может быть короче 8 символов: дописывай нули слева, пока длина меньше 8.'
  - 'Для дописывания нулей: while len(code) < 8: code = "0" + code.'
  solution: |
    s = int(input()) + int(input())
    if s < 0:
        s += 256
    code = bin(s)[2:]
    while len(code) < 8:
        code = "0" + code
    print(code)
  explanation: |
    Сумма — обычное сложение, потом запись в 8 бит. Ловушка: нули слева у положительных.
- id: l15-t9
  type: code
  title: Дробь с точностью до k знаков
  level: 4
  required: false
  homework: true
  mcko:
  - 3
  statement: |
    Правильная дробь p/q (0 < p < q, q — любое число). Выведите первые k цифр её двоичной записи после точки (лишнее отбрасываем без округления).
  input_format: Три строки — p, q и k.
  output_format: Строка из k цифр.
  starter: |
    p = int(input())
    q = int(input())
    k = int(input())
    bits = ""
    # k раз: удвой p, цифра — p // q, остаток — p % q
  examples:
  - &id017 {input: '1

      3

      6', output: '010101'}
  - &id018 {input: '1

      10

      8', output: '00011001'}
  tests:
  - *id017
  - *id018
  - {input: '5

      8

      5', output: '10100', hidden: true}
  - {input: '2

      7

      9', output: '010010010', hidden: true}
  - {input: '1

      2

      3', output: '100', hidden: true}
  - {input: '3

      5

      10', output: '1001100110', hidden: true}
  checker: exact
  hints:
  - 'Цикл ровно k шагов: for i in range(k).'
  - На каждом шаге p *= 2; цифра — p // q (будет 0 или 1); затем p %= q.
  - Цифры склеивай в строку bits.
  solution: |
    p = int(input())
    q = int(input())
    k = int(input())
    bits = ""
    for i in range(k):
        p *= 2
        bits += str(p // q)
        p %= q
    print(bits)
  explanation: |
    Звёздочка: дробь 1/10 в двоичной бесконечная, поэтому берём k знаков. Это объясняет, почему 0.1 неточно хранится в компьютере.
