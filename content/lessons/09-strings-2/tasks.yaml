- id: l09-t6
  type: code
  title: Гласные
  level: 2
  required: true
  homework: false
  mcko: []
  statement: |
    Дан текст из строчных русских букв и пробелов. Посчитайте количество гласных (а, е, ё, и, о, у, ы, э, ю, я).
  input_format: Одна строка.
  output_format: Одно число.
  starter: |
    text = input()
    count = 0
    # перебери буквы
  examples:
  - &id011 {input: привет мир, output: '3'}
  - &id012 {input: программирование, output: '7'}
  tests:
  - *id011
  - *id012
  - {input: ъь, output: '0', hidden: true}
  - {input: я, output: '1', hidden: true}
  - {input: сто лет тому назад, output: '6', hidden: true}
  - {input: шшш, output: '0', hidden: true}
  checker: exact
  hints:
  - 'Перебирай буквы: for letter in text.'
  - Гласная, если letter in "аеёиоуыэюя".
  - При каждой гласной count += 1.
  solution: |
    text = input()
    count = 0
    for letter in text:
        if letter in "аеёиоуыэюя":
            count += 1
    print(count)
  explanation: |
    Цикл по строке + in со строкой-набором.
- id: l09-t7
  type: code
  title: Палиндром
  level: 3
  required: true
  homework: false
  mcko: []
  statement: |
    Палиндром читается одинаково слева направо и справа налево. Выведите «Да», если строка палиндром, иначе «Нет». Регистр учитывается.
  input_format: Одна строка без пробелов.
  output_format: «Да» или «Нет».
  starter: |
    s = input()
    # сравни строку с её разворотом
  examples:
  - &id013 {input: шалаш, output: Да}
  - &id014 {input: кот, output: Нет}
  tests:
  - *id013
  - *id014
  - {input: а, output: Да, hidden: true}
  - {input: abba, output: Да, hidden: true}
  - {input: abcd, output: Нет, hidden: true}
  - {input: Анна, output: Нет, hidden: true}
  - {input: анна, output: Да, hidden: true}
  checker: exact
  hints:
  - 'Развернуть строку: s[::-1].'
  - Сравни s == s[::-1].
  solution: |
    s = input()
    if s == s[::-1]:
        print("Да")
    else:
        print("Нет")
  explanation: |
    Срез с шагом -1. Строка из одной буквы — палиндром.
