- id: l13-t8
  type: code
  title: НОД и НОК
  level: 3
  required: true
  homework: false
  mcko: []
  statement: |
    Напишите функцию `gcd(a, b)` — наибольший общий делитель (алгоритм Евклида: пока b не 0, заменяем пару (a, b) на (b, a % b)). Выведите НОД, а на следующей строке НОК (наименьшее общее кратное: a * b // НОД).
  input_format: Две строки — натуральные числа a и b.
  output_format: 'Две строки: НОД и НОК.'
  starter: |
    def gcd(a, b):
        # алгоритм Евклида
        pass

    a = int(input())
    b = int(input())
    # выведи НОД и НОК
  examples:
  - &id015 {input: '12

      18', output: '6

      36'}
  - &id016 {input: '7

      5', output: '1

      35'}
  tests:
  - *id015
  - *id016
  - {input: '10

      10', output: '10

      10', hidden: true}
  - {input: '100

      75', output: '25

      300', hidden: true}
  - {input: '1

      1000', output: '1

      1000', hidden: true}
  - {input: '48

      36', output: '12

      144', hidden: true}
  - {input: '17

      34', output: '17

      34', hidden: true}
  checker: exact
  hints:
  - 'Пока b != 0: пара меняется на (b, a % b). Для замены нужна временная переменная.'
  - Когда b стало 0, ответ лежит в a. Верни его через return.
  - НОК = a * b // gcd(a, b).
  solution: |
    def gcd(a, b):
        while b != 0:
            r = a % b
            a = b
            b = r
        return a

    a = int(input())
    b = int(input())
    d = gcd(a, b)
    print(d)
    print(a * b // d)
  explanation: |
    Алгоритм Евклида: while и обмен значений из урока 1. Внимание: после вызова gcd внешние a и b не изменились — параметры функции локальные.
- id: l13-t9
  type: code
  title: Числа-палиндромы
  level: 4
  required: false
  homework: true
  mcko: []
  statement: |
    Напишите функцию `reverse_number(n)`, возвращающую число, записанное теми же цифрами в обратном порядке. Сколько чисел от a до b включительно не меняются при развороте (палиндромы)?
  input_format: Две строки — a и b (1 ≤ a ≤ b ≤ 100000).
  output_format: Одно число.
  starter: |
    def reverse_number(n):
        # цифры в обратном порядке
        pass

    a = int(input())
    b = int(input())
    # посчитай палиндромы
  examples:
  - &id017 {input: '1

      100', output: '18'}
  - &id018 {input: '10

      99', output: '9'}
  tests:
  - *id017
  - *id018
  - {input: '100

      200', output: '10', hidden: true}
  - {input: '1

      9', output: '9', hidden: true}
  - {input: '12321

      12321', output: '1', hidden: true}
  - {input: '1

      10000', output: '198', hidden: true}
  checker: exact
  hints:
  - 'Разворот числа цифрами: result = result * 10 + n % 10 в цикле (задача 9 урока 7).'
  - Число x — палиндром, если reverse_number(x) == x.
  solution: |
    def reverse_number(n):
        result = 0
        while n > 0:
            result = result * 10 + n % 10
            n //= 10
        return result

    a = int(input())
    b = int(input())
    count = 0
    for x in range(a, b + 1):
        if reverse_number(x) == x:
            count += 1
    print(count)
  explanation: |
    Звёздочка: собираем функцию из урока 7 и перебор. Можно также через строки (урок 9).
