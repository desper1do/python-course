- id: l17-t1
  type: code
  title: Пары с суммой
  level: 1
  required: true
  homework: false
  mcko: []
  statement: |
    Сколько существует пар целых чисел (a, b), для которых 1 ≤ a ≤ b ≤ n и a + b = s?
  input_format: Две строки — n и s.
  output_format: Одно число.
  starter: |
    n = int(input())
    s = int(input())
    count = 0
    # перебери a, затем b
  examples:
  - &id001 {input: '5

      6', output: '3'}
  - &id002 {input: '3

      2', output: '1'}
  tests:
  - *id001
  - *id002
  - {input: '10

      11', output: '5', hidden: true}
  - {input: '1

      2', output: '1', hidden: true}
  - {input: '4

      100', output: '0', hidden: true}
  - {input: '20

      21', output: '10', hidden: true}
  checker: exact
  hints:
  - Внешний цикл по a от 1 до n, внутренний по b от a до n.
  - Если a + b == s, count += 1.
  solution: |
    n = int(input())
    s = int(input())
    count = 0
    for a in range(1, n + 1):
        for b in range(a, n + 1):
            if a + b == s:
                count += 1
    print(count)
  explanation: |
    Вложенные циклы: внутренний начинается с a, чтобы пара не считалась дважды.
- id: l17-t2
  type: code
  title: Все слова
  level: 1
  required: true
  homework: false
  mcko: []
  statement: |
    Выведите все слова длины k из букв алфавита в алфавитном порядке, каждое на своей строке.
  input_format: Две строки — алфавит (буквы подряд, отсортированы) и k.
  output_format: Столбец слов.
  starter: |
    import itertools
    alphabet = input()
    k = int(input())
    # перебор через product
  examples:
  - &id003 {input: 'АБ

      2', output: 'АА

      АБ

      БА

      ББ'}
  - &id004 {input: 'АБВ

      2', output: 'АА

      АБ

      АВ

      БА

      ББ

      БВ

      ВА

      ВБ

      ВВ'}
  tests:
  - *id003
  - *id004
  - {input: '01

      3', output: '000

      001

      010

      011

      100

      101

      110

      111', hidden: true}
  - {input: 'АБ

      1', output: 'А

      Б', hidden: true}
  - {input: 'ABC

      1', output: 'A

      B

      C', hidden: true}
  - {input: 'КТ

