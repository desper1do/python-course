  starter: |
    def bounding_box(line):
        tokens = line.split()
        expanded = []
        i = 0
        while i < len(tokens):
            if tokens[i] == "Повтори":
                k = int(tokens[i + 1])
                j = i + 3
                body = []
                while tokens[j] != "]":
                    body.append(tokens[j])
                    j += 1
                for r in range(k):
                    expanded += body
                i = j + 1
            else:
                expanded.append(tokens[i])
                i += 1
        x = 0
        y = 0
        angle = 0
        pen = True
        dx = [0, 1, 0, -1]
        dy = [1, 0, -1, 0]
        xs = []
        ys = []
        i = 0
        while i < len(expanded):
            command = expanded[i]
            value = expanded[i + 1]
            if command == "Поднять":
                pen = False
            elif command == "Опустить":
                pen = True
            elif command == "Направо":
                angle = (angle + int(value)) % 360
            elif command == "Налево":
                angle = (angle - int(value)) % 360
            else:
                step = int(value)
                if command == "Назад":
                    step = -step
                if pen:
                    xs.append(x)
                    ys.append(y)
                x += dx[angle // 90] * step
                y += dy[angle // 90] * step
                if pen:
                    xs.append(x)
                    ys.append(y)
            i += 2
        return min(xs), min(ys), max(xs), max(ys)

    line = input()
    x1, y1, x2, y2 = bounding_box(line)
    # сколько точек строго внутри?
  examples:
  - &id011 {input: 'Поднять хвост Назад 3 Направо 90 Вперёд 2 Налево 90 Опустить хвост Повтори 2 [ Вперёд 9 Налево 90 Вперёд 4 Налево 90 ]', output: '24'}
  - &id012 {input: 'Поднять хвост Вперёд 4 Направо 90 Назад 2 Налево 90 Опустить хвост Повтори 2 [ Вперёд 7 Направо 90 Вперёд 10 Направо 90 ]', output: '54'}
  tests:
  - *id011
  - *id012
  - {input: 'Поднять хвост Назад 3 Направо 90 Вперёд 5 Налево 90 Опустить хвост Повтори 2 [ Вперёд 7 Налево 90 Вперёд 4 Налево 90 ]', output: '18', hidden: true}
