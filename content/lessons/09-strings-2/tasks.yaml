- id: l09-t1
  type: code
  title: Первая и последняя
  level: 1
  required: true
  homework: false
  mcko: []
  statement: |
    Выведите первую букву строки, а на следующей строке последнюю.
  input_format: Одна строка (не пустая).
  output_format: Две строки.
  starter: |
    s = input()
    # первая и последняя буквы
  examples:
  - &id001 {input: Python, output: 'P

      n'}
  - &id002 {input: a, output: 'a

      a'}
  tests:
  - *id001
  - *id002
  - {input: дом, output: 'д

      м', hidden: true}
  - {input: Привет мир, output: 'П

      р', hidden: true}
  - {input: '12345', output: '1

      5', hidden: true}
  - {input: Zz, output: 'Z

      z', hidden: true}
  checker: exact
  hints:
  - Первая буква — s[0].
  - Последняя — s[-1].
  solution: |
    s = input()
    print(s[0])
    print(s[-1])
  explanation: |
    Индексы 0 и -1. Для строки из одной буквы обе равны.
